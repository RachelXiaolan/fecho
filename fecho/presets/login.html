<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fecho</title>
  <style>
    :root{--nav:#1b1938;--violet:#c9b4fa;--canvas:#f7f6f2;--ink:#292827;--muted:#73706d;
      --line:#e5e2db;--soft:#f1f0eb;--danger:#9a3f3a;--danger-bg:#fbe9e7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);
      font:15px/1.6 "Avenir Next","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    .card{position:relative;width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:16px;
      padding:36px 34px;box-shadow:0 12px 32px rgba(27,25,56,.08)}
    .mark{width:40px;height:40px;border-radius:11px;background:var(--violet);color:var(--nav);
      display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:18px}
    h1{font-size:22px;margin:0 0 6px;font-weight:650;letter-spacing:-.3px}
    p{margin:0 0 22px;color:var(--muted)}
    a.btn{display:block;text-align:center;background:var(--nav);color:#fff;text-decoration:none;
      border-radius:10px;padding:13px 16px;font-weight:600}
    a.btn:hover{background:#100e24}
    .error{display:none;background:var(--danger-bg);color:var(--danger);border-radius:8px;
      padding:11px 13px;margin-bottom:18px;font-size:14px}
    .foot{margin-top:18px;font-size:12.5px;color:var(--muted)}
    .lang-switch{position:absolute;top:16px;right:16px;display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px}
    .lang-switch button{font:inherit;border:0;background:transparent;padding:4px 9px;border-radius:7px;
      font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
    .lang-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(25,22,18,.08)}
  </style>
</head>
<body>
  <main class="card">
    <div class="lang-switch" role="group" data-i18n-aria="lang_aria"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div>
    <div class="mark">f</div>
    <h1 data-i18n="heading"></h1>
    <p data-i18n="desc"></p>
    <div class="error" id="error"></div>
    <a class="btn" href="/auth/login" data-i18n="button"></a>
    <div class="foot" data-i18n="foot"></div>
  </main>
  <!-- 界面文字。服务器传回的错误信息不翻。 -->
  <script type="application/json" id="i18n">
  {
    "zh": {
      "doc_title": "登录 · Fecho", "lang_aria": "界面语言", "heading": "登录 Fecho",
      "desc": "用你的 Mobius 账号登录。只接受 @__DOMAIN__ 的邮箱。",
      "button": "用 Mobius 登录",
      "foot": "一次登录会同时连上 Mobius，之后服务器替你同步名下的 issue。"
    },
    "en": {
      "doc_title": "Sign in · Fecho", "lang_aria": "Interface language", "heading": "Sign in to Fecho",
      "desc": "Sign in with your Mobius account. Only @__DOMAIN__ email addresses are accepted.",
      "button": "Sign in with Mobius",
      "foot": "Signing in also connects Mobius, so the server can keep your issues in sync."
    }
  }
  </script>
  <script>
    const I18N = JSON.parse(document.getElementById('i18n').textContent);
    const LANG_KEY = 'fecho-lang';
    let lang = (() => { try { return localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh'; } catch (_) { return 'zh'; } })();
    const t = key => (I18N[lang] || {})[key] ?? I18N.zh[key] ?? key;
    function applyStatic() {
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
      document.title = t('doc_title');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
      document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
      lang = b.dataset.lang; try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
      applyStatic();
    }));
    applyStatic();

    const msg = new URLSearchParams(location.search).get('error');
    if (msg) { const el = document.getElementById('error'); el.textContent = msg; el.style.display = 'block'; }
  </script>
</body>
</html>
