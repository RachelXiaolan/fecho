<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fecho</title>
  <link rel="icon" href="/assets/fecho-mark.svg" type="image/svg+xml">
  <script id="theme-boot">try{var s=localStorage.getItem('fecho-theme');document.documentElement.dataset.theme=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(_){document.documentElement.dataset.theme='light';}
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#theme-toggle');if(!b)return;var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('fecho-theme',n);}catch(_){}});</script>
  <style>
    :root{--nav:#5d526b;--violet:#d8c6dc;--taro:#a99bb5;--butter:#f0c75f;--butter-light:#f7d97e;--butter-deep:#b6801e;
      --canvas:#fff9ec;--ink:#3f3748;--muted:#6f6578;--line:#ddcfdd;--soft:#fff4e2;--danger:#a34f58;--danger-bg:#fbe8e8;
      --surface:#fffdf9;--primary:#f0c75f;--primary-ink:#3f3748;--primary-hover:#f7d97e;color-scheme:light}
    /* 黑夜模式：和 Fecho 面板同一套，记在 fecho-theme */
    :root[data-theme="dark"]{--canvas:#18121e;--nav:#302838;--violet:#d8c6dc;--taro:#c7b5cf;--butter:#f0c75f;--butter-light:#f7d97e;--butter-deep:#b6801e;
      --ink:#fff8ed;--muted:#c9bdc8;--line:#4b3e53;--soft:#372d3d;--danger:#f1a5ad;--danger-bg:#49252c;
      --surface:#2b2431;--primary:#f0c75f;--primary-ink:#33263a;--primary-hover:#f7d97e;color-scheme:dark}
    .corner{position:absolute;top:16px;right:16px;display:flex;gap:6px;align-items:center}
    .theme-toggle{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--soft);
      color:var(--muted);display:grid;place-items:center;cursor:pointer}
    .theme-toggle:hover{color:var(--ink)}
    .theme-toggle .i-sun,:root[data-theme="dark"] .theme-toggle .i-moon{display:none}
    :root[data-theme="dark"] .theme-toggle .i-sun{display:block}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);
      font:15px/1.6 "Avenir Next","SF Pro Rounded","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    .card{position:relative;width:min(420px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;
      padding:36px 34px;box-shadow:0 12px 32px rgba(93,82,107,.12)}
    .mark{width:44px;height:44px;display:grid;place-items:center;margin-bottom:18px;border:1px solid var(--butter-deep);border-bottom-width:4px;border-radius:50%;background:var(--butter);box-shadow:0 4px 0 var(--butter-deep)}
    .mark svg{width:31px;height:31px}
    h1{font-size:22px;margin:0 0 6px;font-weight:650;letter-spacing:-.3px}
    p{margin:0 0 22px;color:var(--muted)}
    a.btn{display:block;text-align:center;background:var(--primary);color:var(--primary-ink);text-decoration:none;
      border:1px solid var(--butter-deep);border-bottom-width:3px;border-radius:10px;padding:12px 16px;font-weight:700;box-shadow:0 2px 0 var(--butter-deep)}
    a.btn:hover{background:var(--primary-hover)}
    .error{display:none;background:var(--danger-bg);color:var(--danger);border-radius:8px;
      padding:11px 13px;margin-bottom:18px;font-size:14px}
    .foot{margin-top:18px;font-size:12.5px;color:var(--muted)}
    .lang-switch{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px}
    .lang-switch button{font:inherit;border:0;background:transparent;padding:4px 9px;border-radius:7px;
      font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
    .lang-switch button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(25,22,18,.08)}
  </style>
</head>
<body>
  <main class="card">
    <div class="corner"><div class="lang-switch" role="group" data-i18n-aria="lang_aria"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div><button class="theme-toggle" id="theme-toggle" type="button" data-i18n-aria="theme_aria"><svg class="i-moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z" fill="currentColor"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 200 200"><rect x="76" y="36" width="48" height="128" rx="14" fill="#fffdf9"/><rect x="36" y="76" width="128" height="48" rx="14" fill="#fffdf9"/></svg></span>
    <h1 data-i18n="heading"></h1>
    <p data-i18n="desc"></p>
    <div class="error" id="error"></div>
    <a class="btn" href="/auth/login" data-i18n="button"></a>
    <div class="foot" data-i18n="foot"></div>
    <div class="foot"><a href="/guide" data-i18n="guide"></a></div>
  </main>
  <!-- 界面文字。服务器传回的错误信息不翻。 -->
  <script type="application/json" id="i18n">
  {
    "zh": {
      "doc_title": "登录 · Fecho", "lang_aria": "界面语言", "theme_aria": "切换白天/黑夜模式", "heading": "登录 Fecho",
      "desc": "用你的 Mobius 账号登录。只接受 @__DOMAIN__ 的邮箱。",
      "button": "用 Mobius 登录",
      "foot": "一次登录会同时连上 Mobius，之后服务器替你同步名下的 issue。",
      "guide": "第一次用？先看接入与验收指南 →"
    },
    "en": {
      "doc_title": "Sign in · Fecho", "lang_aria": "Interface language", "theme_aria": "Switch light/dark mode", "heading": "Sign in to Fecho",
      "desc": "Sign in with your Mobius account. Only @__DOMAIN__ email addresses are accepted.",
      "button": "Sign in with Mobius",
      "foot": "Signing in also connects Mobius, so the server can keep your issues in sync.",
      "guide": "New here? Read the setup guide first →"
    }
  }
  </script>
  <script>
    const I18N = JSON.parse(document.getElementById('i18n').textContent);
    const LANG_KEY = 'fecho-lang';
    let lang = (() => { try { return localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh'; } catch (_) { return 'zh'; } })();
    const t = key => (I18N[lang] || {})[key] ?? I18N.zh[key] ?? key;
    function applyStatic() {
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
      document.title = t('doc_title');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
      document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
      lang = b.dataset.lang; try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
      applyStatic();
    }));
    applyStatic();

    const msg = new URLSearchParams(location.search).get('error');
    if (msg) { const el = document.getElementById('error'); el.textContent = msg; el.style.display = 'block'; }
  </script>
</body>
</html>
