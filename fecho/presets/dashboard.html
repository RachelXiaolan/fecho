<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fecho</title>
  <link rel="icon" href="/assets/fecho-mark.svg" type="image/svg+xml">
  <script id="theme-boot">try{var s=localStorage.getItem('fecho-theme');document.documentElement.dataset.theme=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(_){document.documentElement.dataset.theme='light';}</script>
    <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" data-i18n-aria="nav_aria">
    <div class="brand-row">

        <span class="brand-words"><span class="brand-name">Fecho</span><span class="brand-copy">FEED WORK. ECHO PROGRESS.</span></span>
      </button>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true" data-i18n-aria="sidebar_collapse"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only" data-i18n="sidebar_collapse"></span></button>
    </div>
    <div class="nav-label">Workspace</div>
    <nav class="nav">
      <button class="active" data-view="today"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3M16 2v3M3.5 9h17M4 5.5h16a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_today"></span><span class="count" id="nav-today">—</span></button>
      <button data-view="review"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 12.5 2 2 4-4M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_review"></span><span class="count" id="nav-review">—</span></button>
      <button data-view="tasks"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_tasks"></span><span class="count" id="nav-tasks">—</span></button>
      <button data-view="reports"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7l-4-4Zm0 0v4h4M9 12h6M9 16h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_reports"></span><span class="count" id="nav-reports">—</span></button>
      <button data-view="system"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_system"></span><span class="count" id="nav-system">—</span></button>
      <button data-view="feedback" data-cloud-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5A8.3 8.3 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_feedback"></span><span class="count" id="nav-feedback">—</span></button>
      <button data-view="admin" data-admin-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.3 2.9 8.3 7 9.5 4.1-1.2 7-5.2 7-9.5V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_admin"></span><span class="count" id="nav-admin">—</span></button>
    </nav>
    <a class="guide-link" href="/guide" target="_blank" rel="noopener"><span class="guide-icon" aria-hidden="true">↗</span><span class="guide-text" data-i18n="nav_guide"></span></a>
    <div class="sidebar-foot">
      <div class="connection" data-local-only><i class="pulse"></i><span id="connection-copy" data-i18n="connection_local"></span></div>
      <div class="account-menu" id="account-menu" data-cloud-only hidden>
        <button class="account-trigger" id="account-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-popover" data-i18n-aria="account_aria"><span class="account-avatar" id="account-avatar" aria-hidden="true"></span><span class="account-copy"><strong id="account-name"></strong><small id="account-email"></small></span><svg class="account-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="account-popover" id="account-popover" role="menu" data-i18n-aria="account_menu_aria" hidden>
          <div class="account-summary"><span class="account-avatar" data-account-avatar aria-hidden="true"></span><span class="account-copy"><strong data-account-name></strong><small data-account-email></small></span></div>
          <div class="account-menu-rule" role="separator"></div>
          <button class="account-menu-item" type="button" role="menuitem" data-account-action="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8.5-3a8.5 8.5 0 0 0-.13-1.4l2-1.5-2-3.5-2.4.9a8.5 8.5 0 0 0-2.4-1.4L15.2 2h-4l-.37 2.6a8.5 8.5 0 0 0-2.4 1.4l-2.4-.9-2 3.5 2 1.5a8.5 8.5 0 0 0 0 2.8l-2 1.5 2 3.5 2.4-.9a8.5 8.5 0 0 0 2.4 1.4l.37 2.6h4l.37-2.6a8.5 8.5 0 0 0 2.4-1.4l2.4.9 2-3.5-2-1.5c.08-.46.13-.93.13-1.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="account_settings"></span></button>
          <div class="account-menu-rule" role="separator"></div>
          <button class="account-menu-item danger" id="account-logout" type="button" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="account_logout"></span></button>
        </div>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <div class="page-title"><h1 id="page-title"></h1><p id="page-subtitle"></p></div>
      </div>
      <div class="topbar-actions">
        <div class="toolbar" data-i18n-aria="filters_aria">
          <div class="field"><label for="work-date" data-i18n="filter_date"></label><input id="work-date" type="date"></div>
          <div class="field filter-select" data-filter-select="agent-filter"><label id="agent-filter-label" for="agent-filter-trigger" data-i18n="filter_agent"></label><select id="agent-filter" class="filter-select-native" aria-hidden="true" tabindex="-1"><option value=""></option></select><button class="filter-select-trigger" id="agent-filter-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="agent-filter-menu" aria-labelledby="agent-filter-label" data-filter-trigger="agent-filter" disabled></button><div class="filter-menu" id="agent-filter-menu" role="listbox" aria-labelledby="agent-filter-label" hidden></div></div>
          <div class="field filter-select" data-filter-select="source-filter"><label id="source-filter-label" for="source-filter-trigger" data-i18n="filter_source"></label><select id="source-filter" class="filter-select-native" aria-hidden="true" tabindex="-1"><option value=""></option></select><button class="filter-select-trigger" id="source-filter-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="source-filter-menu" aria-labelledby="source-filter-label" data-filter-trigger="source-filter" disabled></button><div class="filter-menu" id="source-filter-menu" role="listbox" aria-labelledby="source-filter-label" hidden></div></div>
          <div class="field filter-select" data-filter-select="status-filter"><label id="status-filter-label" for="status-filter-trigger" data-i18n="filter_status"></label><select id="status-filter" class="filter-select-native" aria-hidden="true" tabindex="-1"><option value=""></option></select><button class="filter-select-trigger" id="status-filter-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="status-filter-menu" aria-labelledby="status-filter-label" data-filter-trigger="status-filter" disabled></button><div class="filter-menu" id="status-filter-menu" role="listbox" aria-labelledby="status-filter-label" hidden></div></div>
          <button class="btn" id="reload-day" type="button" data-i18n="reload"></button>
        </div>
        <button class="lang-switch" id="lang-toggle" type="button" data-i18n-aria="lang_aria"></button>
        <button class="theme-toggle" id="theme-toggle" type="button" data-i18n-aria="theme_aria"><svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z" fill="currentColor"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <main>
      <div id="error-state" class="error-state"><span id="error-copy"></span><button class="btn small" id="retry" data-i18n="retry"></button></div>
      <div id="viewas" class="viewas" role="status"><span id="viewas-copy"></span><button class="btn small" id="viewas-exit" data-i18n="viewas_exit"></button></div>
      <div id="loading" class="loading show"><div class="spinner"></div><span id="loading-copy" data-i18n="loading"></span></div>

      <section class="view active" data-page="today" aria-labelledby="today-heading">
        <div class="hero"><div class="eyebrow" id="today-date">WORK LOG</div><h2 id="today-heading" data-i18n="hero_default"></h2><p id="today-summary" data-i18n="hero_loading"></p><button class="btn primary hero-action" data-go="review" data-i18n="hero_review"></button></div>
        <div class="metrics" id="metrics"></div>
        <div class="two-col">
          <div><div class="section-head"><div><h2 data-i18n="today_tasks"></h2><p data-i18n="today_tasks_sub"></p></div></div><div class="panel" id="today-tasks"></div></div>
          <div><div class="section-head"><div><h2 data-i18n="attention"></h2><p data-i18n="attention_sub"></p></div></div><div class="panel" id="attention"></div></div>
        </div>
        <div class="section-head"><div><h2 data-i18n="timeline"></h2><p data-i18n="timeline_sub"></p></div></div><div class="panel" id="timeline"></div>
      </section>

      <section class="view" data-page="review" aria-labelledby="review-heading">
        <div class="section-head"><div><h2 id="review-heading" data-i18n="review_heading"></h2><p data-i18n="review_sub"></p></div><span class="tag" id="review-total">0</span></div>
        <div class="panel" id="review-list"></div>
        <div class="section-head"><div><h2 data-i18n="hidden_heading"></h2><p data-i18n="hidden_sub"></p></div></div>
        <div class="panel" id="hidden-list"></div>
      </section>

      <section class="view" data-page="tasks" aria-labelledby="tasks-heading">
        <div class="section-head"><div><h2 id="tasks-heading" data-i18n="tasks_heading"></h2><p data-i18n="tasks_sub"></p></div>
          <div class="segmented" id="task-tabs"><button class="active" data-task-status="all" data-i18n="tab_all"></button><button data-task-status="open" data-i18n="tab_open"></button><button data-task-status="done" data-i18n="tab_done"></button><button data-task-status="merged" data-i18n="tab_merged"></button></div></div>
        <div class="panel" id="task-list"></div>
      </section>

      <section class="view" data-page="reports" aria-labelledby="reports-heading">
        <div class="section-head"><div><h2 id="reports-heading" data-i18n="reports_heading"></h2></div><div class="button-row"><div class="snap-group" id="snap-group" hidden><button class="btn" id="snap-report" type="button"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="snap"></span></button><button class="btn snap-more" id="snap-settings" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n-aria="snap_settings"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="snap-popover" id="snap-popover" role="dialog" hidden></div></div><button class="btn" id="edit-report" hidden data-i18n="edit"></button><button class="btn primary" id="regenerate" data-i18n="regenerate"></button></div></div>
        <div class="gen-progress" id="gen-progress" role="status" aria-live="polite" hidden></div>
        <div id="report-dirty" class="dirty"><span id="report-dirty-copy"></span><button class="btn small" id="dirty-regenerate" data-i18n="regenerate_now"></button></div>
        <div class="panel report-layout"><div class="report-nav" id="report-tabs"><button class="active" data-report-tab="daily" data-i18n="tab_daily"></button><button data-report-tab="voice" data-i18n="tab_voice"></button><button data-report-tab="history" data-i18n="tab_history"></button><button data-report-tab="warnings" data-i18n="tab_warnings"></button><div class="quick-api-entry"><div class="quick-api-row"><button id="quick-api-open" type="button"><span data-i18n="quick_api"></span></button><button id="quick-api-help" type="button" data-i18n-aria="quick_api_help_label">?</button></div><div id="quick-api-help-text" class="quick-api-help-text" hidden></div></div></div><div class="report-paper" id="report-content" data-i18n="not_generated"></div></div>
      </section>

      <section class="view" data-page="system" aria-labelledby="system-heading">
        <div class="section-head"><div><h2 id="system-heading" data-i18n="system_heading"></h2><p data-i18n="system_sub"></p></div></div>
        <div class="two-col"><div><div class="panel panel-pad" id="doctor"></div></div><div><div class="panel panel-pad" id="automation-status"></div><div class="panel panel-pad" id="sources" style="margin-top:18px"></div></div></div>
        <div class="section-head"><div><h2 data-i18n="recent_scans"></h2><p data-i18n="recent_scans_sub"></p></div></div><div class="panel" style="overflow:auto"><table><thead><tr><th data-i18n="th_time"></th><th data-i18n="th_agent"></th><th data-i18n="th_project"></th><th data-i18n="th_status"></th><th data-i18n="th_result"></th></tr></thead><tbody id="scan-runs"></tbody></table></div>
      </section>

      <section class="view" data-page="settings" aria-labelledby="settings-heading">
        <div class="section-head"><div><h2 id="settings-heading" data-i18n="settings_time"></h2><p data-i18n="settings_time_sub"></p></div></div>
        <div class="panel"><div class="setting-row"><div><div class="item-title" data-i18n="daily_time_label"></div><div class="meta" id="daily-time-copy">—</div></div><div class="button-row"><select id="daily-time" data-i18n-aria="daily_time_aria"></select><button class="btn primary" id="save-daily-time" data-i18n="save"></button></div></div></div>

        <div class="section-head"><div><h2 data-i18n="agents_heading"></h2><p data-i18n="agents_sub"></p></div></div>
        <div class="panel" id="agent-list"></div>

        <div class="section-head"><div><h2 data-i18n="folders_heading"></h2><p data-i18n="folders_sub"></p></div><span class="tag" id="folder-count">—</span></div>
        <div class="panel"><div id="folder-list"></div><div id="folders-gone" class="folders-gone" hidden></div><div class="panel-foot"><input id="folder-add" data-i18n-placeholder="folder_add_placeholder" data-i18n-aria="folder_add_aria"><button class="btn small" id="folder-add-btn" data-i18n="add"></button><button class="btn primary" id="save-folders" data-i18n="save_selection"></button></div></div>

        <div class="section-head"><div><h2 data-i18n="style_heading"></h2><p data-i18n="style_sub"></p></div><span class="tag" id="style-updated">—</span></div>
        <div class="panel"><textarea id="style-editor" class="style-editor" data-i18n-aria="style_aria" data-i18n-placeholder="style_placeholder"></textarea><div class="panel-foot"><span class="meta" style="margin:0;flex:1" data-i18n="style_hint"></span><button class="btn small" id="clear-style" data-i18n="clear"></button><button class="btn primary" id="save-style" data-i18n="save"></button></div></div>

        <div class="section-head"><div><h2 data-i18n="admin_section"></h2><p data-i18n="admin_section_sub"></p></div></div>
        <div class="panel panel-pad" id="admin-status"></div>
      </section>

      <section class="view" data-page="feedback" aria-labelledby="feedback-heading">
        <div class="section-head"><div><h2 id="feedback-heading" data-i18n="fb_heading"></h2><p data-i18n="fb_sub"></p></div></div>
        <div class="panel fb-form" id="fb-drop">
          <textarea id="fb-body" class="fb-editor" data-i18n-placeholder="fb_placeholder" data-i18n-aria="fb_body_label"></textarea>
          <div class="fb-draft" id="fb-draft"></div>
          <div class="panel-foot"><input type="file" id="fb-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><button class="btn small" id="fb-add" type="button"></button><span class="meta" style="margin:0;flex:1" data-i18n="fb_hint"></span><button class="btn primary" id="fb-submit" type="button" data-i18n="fb_submit"></button></div>
        </div>
        <div class="section-head"><div><h2 data-i18n="fb_mine"></h2><p data-i18n="fb_mine_sub"></p></div></div>
        <div class="panel" id="fb-mine"></div>
      </section>

      <section class="view" data-page="admin" aria-labelledby="admin-heading">
        <div class="section-head"><div><h2 id="admin-heading" data-i18n="pending_heading"></h2><p data-i18n="pending_sub"></p></div><span class="tag" id="request-count">0</span></div>
        <div class="panel" id="request-list"></div>
        <div class="section-head"><div><h2 data-i18n="members_heading"></h2><p data-i18n="members_sub"></p></div></div>
        <div class="panel" style="overflow:auto"><table><thead><tr><th data-i18n="th_member"></th><th data-i18n="th_role"></th><th data-i18n="th_report_time"></th><th data-i18n="th_last_active"></th><th data-i18n="th_updates"></th><th></th></tr></thead><tbody id="user-list"></tbody></table></div>
        <div class="section-head"><div><h2 data-i18n="fb_admin_heading"></h2><p data-i18n="fb_admin_sub"></p></div><span class="tag" id="fb-new-count">—</span></div>
        <div class="panel" id="fb-all"></div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-copy"></span><button id="undo-action" data-i18n="undo"></button></div>
