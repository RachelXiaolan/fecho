<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fecho</title>
  <script id="theme-boot">try{var s=localStorage.getItem('fecho-theme');document.documentElement.dataset.theme=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(_){document.documentElement.dataset.theme='light';}</script>
  <style>
    :root{
      --nav:#1b1938;--nav-deep:#100e24;--nav-text:#f7f5ff;--violet:#c9b4fa;
      --teal:#0e3030;--canvas:#f7f6f2;--surface:#fff;--surface-soft:#f1f0eb;
      --ink:#292827;--muted:#73706d;--faint:#9a9794;--line:#e5e2db;
      --success:#23634d;--success-bg:#e8f3ed;--warning:#8a5b17;--warning-bg:#fff3d9;
      --danger:#9a3f3a;--danger-bg:#fbe9e7;--shadow:0 1px 2px rgba(25,22,18,.05);
      --topbar-bg:rgba(247,246,242,.94);--surface-alt:#FBFAF7;--ink-soft:#45433f;--chip-bg:#eceaf5;--chip-ink:#5e587f;
      --viewas-ink:#3f3a6b;--hover-bg:#faf9ff;--link:#5b4fb0;--switch-off:#d9d6ce;--primary:var(--nav);color-scheme:light;
      /* 日报编辑器（CodeMirror）。源码在仓库的 editor/，配色全部读这几个变量 */
      --violet-ink:#6b5fc0;--ed-active:rgba(107,95,192,.06);--ed-sel:rgba(107,95,192,.18);
      --ed-code-bg:#f2f0f7;--ed-code-ink:#8a5b17;--ed-kw:#7c3aed;--ed-str:#1f7a4d;
      --ed-num:#b4531a;--ed-fn:#2563a8;--ed-type:#8a5b17;--ed-op:#1d6f86;
    }
    /* 黑夜模式：只换颜色变量，版式一点不动 */
    :root[data-theme="dark"]{
      --nav:#15132a;--nav-deep:#0c0b18;--canvas:#131217;--surface:#1b1a21;--surface-soft:#26252d;--surface-alt:#1f1e25;
      --ink:#e9e7e3;--ink-soft:#cfccc7;--muted:#a19e99;--faint:#7a7771;--line:#34323b;
      --success:#7fd1ad;--success-bg:#173228;--warning:#e9bb6d;--warning-bg:#342810;--danger:#f1a39c;--danger-bg:#3b1e1c;
      --shadow:0 1px 2px rgba(0,0,0,.4);--topbar-bg:rgba(19,18,23,.92);--chip-bg:#2c2940;--chip-ink:#c9c3ea;
      --viewas-ink:#d6d0f5;--hover-bg:#26242f;--link:#b3a6f2;--switch-off:#46444e;--primary:#6f5fc7;color-scheme:dark;
      --violet-ink:#a88bfa;--ed-active:rgba(168,139,250,.07);--ed-sel:rgba(168,139,250,.26);
      --ed-code-bg:#2b2932;--ed-code-ink:#e6c07b;--ed-kw:#c792ea;--ed-str:#c3e88d;
      --ed-num:#f78c6c;--ed-fn:#82aaff;--ed-type:#ffcb6b;--ed-op:#89ddff;
    }
    *{box-sizing:border-box}
    html{background:var(--canvas)}
    body{margin:0;min-height:100vh;color:var(--ink);background:var(--canvas);
      font:460 14px/1.5 "Avenir Next","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:disabled{cursor:wait;opacity:.55}
    a{color:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);transition:grid-template-columns .2s ease}
    /* 高度按缩放比例换算：整站缩放后 100vh 会被一起放大，侧边栏会比屏幕高 */
    .sidebar{position:sticky;top:0;height:calc(100vh / var(--zoom,1));padding:26px 18px 20px;background:var(--nav);
      color:var(--nav-text);display:flex;flex-direction:column;overflow-x:hidden}
    .brand-row{display:flex;align-items:flex-start;gap:8px;padding:0 0 28px}
    .brand{display:flex;align-items:center;gap:11px;padding:0 10px;flex:1;min-width:0}
    .sidebar-toggle{flex:none;width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.15);
      border-radius:8px;background:transparent;color:#bcbac9;display:grid;place-items:center}
    .sidebar-toggle:hover{background:rgba(255,255,255,.08);color:#fff}
    .sidebar-toggle svg{transition:transform .2s ease}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .brand-mark{width:32px;height:32px;flex:none;border-radius:9px;background:var(--violet);color:var(--nav);
      display:grid;place-items:center;font-size:17px;font-weight:700;letter-spacing:-1px}
    .brand-name{font-size:19px;font-variation-settings:"wght" 540;font-weight:600;letter-spacing:-.4px}
    .brand-copy{font-size:11px;color:#bcbac9;margin-top:-1px}
    .nav-icon{width:17px;height:17px;flex:none;opacity:.8}
    .nav button.active .nav-icon{opacity:1}
    /* 收起后只剩图标：没有图标的话侧边栏就是一列光秃秃的数字，认不出是哪一页 */
    .shell.sidebar-collapsed .nav button .count{display:none}
    .nav-label{padding:0 10px 8px;color:#77738f;font-size:10px;font-weight:700;
      letter-spacing:1.2px;text-transform:uppercase}
    .nav{display:grid;gap:4px}
    .nav button{width:100%;border:0;background:transparent;color:#bcbac9;text-align:left;
      border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;display:flex;align-items:center;gap:9px}
    .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    .nav button.active{background:rgba(201,180,250,.15);color:#fff}
    .nav .count{min-width:22px;padding:1px 6px;text-align:center;border-radius:99px;
      background:rgba(255,255,255,.09);font-size:11px}
    .nav button.active .count{background:var(--violet);color:var(--nav)}
    .sidebar-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid #3f3a52}
    .connection{display:flex;gap:8px;align-items:center;color:#bcbac9;font-size:12px}
    .pulse{width:7px;height:7px;border-radius:50%;background:#7dd5ac;box-shadow:0 0 0 4px rgba(125,213,172,.1)}
    .workspace{min-width:0}
    /* 收起：缩成 78px 的图标条，不是整个藏起来——收起后还看得见在哪一页。
       640px 以下侧边栏是底部导航条，收了就没法切页面，所以那一档不参与 */
    .shell.sidebar-collapsed{grid-template-columns:78px minmax(0,1fr)}
    .shell.sidebar-collapsed .sidebar{padding-left:10px;padding-right:10px}
    .shell.sidebar-collapsed .brand-row{display:grid;justify-items:center;gap:10px}
    .shell.sidebar-collapsed .brand{flex:none;padding:0}
    .shell.sidebar-collapsed .brand-name,.shell.sidebar-collapsed .brand-copy,
    .shell.sidebar-collapsed .nav-label,.shell.sidebar-collapsed .nav button .nav-text,
    .shell.sidebar-collapsed .sidebar-foot span,.shell.sidebar-collapsed .guide-text{display:none}
    .shell.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
    .shell.sidebar-collapsed .nav button{justify-content:center;min-height:44px;padding:10px 8px}
    .shell.sidebar-collapsed .guide-link{justify-content:center;padding:10px 8px}
    .topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
    .icon-btn{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;flex:none;
      background:var(--surface-soft);color:var(--muted);display:grid;place-items:center}
    .icon-btn:hover{color:var(--ink)}
    /* 缩放没有按钮了（Ctrl/⌘ + 滚轮），所以缩的时候闪一下当前倍数，不然没反馈 */
    .zoom-badge{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:60;
      padding:6px 14px;border-radius:99px;background:var(--ink);color:var(--surface);
      font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none;
      opacity:0;transition:opacity .15s}
    .zoom-badge.show{opacity:.92}
    .topbar{min-height:86px;padding:19px 34px;border-bottom:1px solid var(--line);
      background:var(--topbar-bg);backdrop-filter:blur(12px);display:flex;
      align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:10}
    .page-title h1{font-size:24px;line-height:1.08;letter-spacing:-.6px;margin:0;font-weight:600}
    .page-title p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .field{display:grid;gap:4px}
    .field label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px}
    input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;
      min-height:38px;padding:7px 10px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:#7771a6;box-shadow:0 0 0 3px rgba(119,113,166,.1)}
    .toolbar select{max-width:142px}
    main{max-width:1240px;margin:0 auto;padding:30px 34px 72px}
    .view{display:none}.view.active{display:block;animation:enter .24s ease both}
    @keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .loading{display:none;padding:80px 20px;text-align:center;color:var(--muted)}
    .loading.show{display:block}
    .spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--primary);
      border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-state{display:none;background:var(--danger-bg);color:var(--danger);padding:14px 16px;
      border-radius:8px;margin-bottom:18px}.error-state.show{display:flex;justify-content:space-between;gap:16px}
    .hero{background:var(--nav);color:#fff;border-radius:16px;padding:27px 30px;position:relative;
      overflow:hidden;box-shadow:0 12px 32px rgba(27,25,56,.16)}
    .hero:after{content:"";position:absolute;width:360px;height:280px;right:-80px;top:-130px;
      background:radial-gradient(circle,rgba(201,180,250,.46),rgba(201,180,250,0) 68%)}
    .eyebrow{font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#bcbac9}
    .hero h2{font-size:30px;line-height:1.1;letter-spacing:-.8px;margin:7px 0 8px;font-weight:600;max-width:700px}
    .hero p{margin:0;color:#bcbac9;max-width:640px}
    .hero .hero-action{position:absolute;right:28px;bottom:27px;z-index:1}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 24px}
    .metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow)}
    .metric strong{display:block;font-size:27px;line-height:1;font-weight:600;letter-spacing:-.7px}
    .metric span{display:block;color:var(--muted);font-size:11px;margin-top:7px}
    .metric.attention strong{color:var(--warning)}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:28px 0 12px}
    .section-head h2{font-size:17px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.25px}
    .section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
    .panel-pad{padding:20px}
    .item{padding:16px 18px;border-top:1px solid var(--line)}.item:first-child{border-top:0}
    .item-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
    .item-title{font-size:14px;font-weight:600}.item-body{margin-top:5px;color:var(--ink-soft)}
    .meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .tag{display:inline-flex;align-items:center;min-height:22px;border-radius:99px;padding:2px 8px;
      background:var(--surface-soft);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.2px}
    .tag.done,.tag.human{background:var(--success-bg);color:var(--success)}
    .tag.blocked,.tag.low{background:var(--danger-bg);color:var(--danger)}
    .tag.wip,.tag.medium{background:var(--warning-bg);color:var(--warning)}
    .tag.unknown{background:var(--chip-bg);color:var(--chip-ink)}
    .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:38px;
      padding:8px 13px;font-weight:600;font-size:12px}
    .btn:hover{border-color:#85809d;background:var(--hover-bg)}.btn:active{transform:translateY(1px)}
    .btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}
    .btn.primary:hover{background:var(--nav-deep)}
    .btn.danger{color:var(--danger)}
    .btn.small{min-height:32px;padding:6px 10px}
    .empty{padding:44px 20px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
    details.timeline{border-top:1px solid var(--line)}details.timeline:first-child{border-top:0}
    details.timeline summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;gap:14px}
    details.timeline summary::-webkit-details-marker{display:none}
    details.timeline[open] summary{background:var(--surface-alt)}
    .timeline-body{padding:0 18px 17px 34px}.progress-line{position:relative;padding:8px 0 8px 18px;border-left:1px solid var(--line)}
    .progress-line:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#7771a6;left:-4px;top:15px}
    .two-col{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:18px}
    .review-card{padding:18px;border-top:1px solid var(--line)}.review-card:first-child{border-top:0}
    .review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,310px);gap:22px;align-items:start}
    .review-actions{display:grid;gap:8px}.review-actions select,.review-actions textarea{width:100%}
    .review-actions textarea{min-height:76px;resize:vertical}
    .button-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:17px 18px;border-top:1px solid var(--line)}
    .task-row:first-child{border-top:0}.task-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .task-actions select{max-width:210px}
    .segmented{display:flex;gap:3px;background:var(--surface-soft);padding:3px;border-radius:9px;width:max-content}
    .segmented button{border:0;background:transparent;padding:7px 11px;border-radius:7px;color:var(--muted);font-size:11px;font-weight:700}
    .segmented button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
    .dirty{display:none;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;
      border-radius:10px;background:var(--warning-bg);color:var(--warning);margin-bottom:14px}
    .dirty.show{display:flex}
    .report-layout{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:520px}
    .report-nav{padding:14px;border-right:1px solid var(--line);background:var(--surface-alt)}
    .report-nav button{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;font-size:12px}
    .report-nav button.active{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
    .quick-api-entry{position:relative;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
    .quick-api-row{display:flex;align-items:center;gap:4px}
    .quick-api-row #quick-api-open{flex:1;min-width:0}
    .quick-api-row #quick-api-help{width:26px;flex:none;padding:0;text-align:center;
      font-weight:700;color:var(--muted)}
    /* 气泡挂到 body 上定位，免得被左边这一列的 overflow 裁掉 */
    .quick-api-help-text{position:fixed;z-index:50;width:330px;max-width:calc(100vw - 16px);
      margin:0;padding:13px 15px;border:1px solid var(--line);border-radius:10px;
      background:var(--ink);color:var(--surface);font-size:11.5px;line-height:1.65;
      box-shadow:0 10px 28px rgba(20,18,32,.22)}
    .quick-api-help-text b{color:var(--surface)}
    .quick-api-help-text h4{margin:0 0 6px;font-size:11.5px}
    .quick-api-help-text ol{margin:0 0 10px;padding-left:17px}
    .quick-api-help-text li{margin-bottom:3px}
    .quick-api-help-text p{margin:0 0 9px}
    .quick-api-help-text p:last-child{margin-bottom:0}
    .quick-api-help-text .qa-note{padding-top:9px;border-top:1px solid rgba(255,255,255,.16);
      color:var(--faint)}
    .report-paper{padding:26px 34px 30px;font-size:14.5px;line-height:1.75;color:var(--ink)}
    /* 改日报时编辑器自己铺满，内边距交给编辑器 */
    .report-paper:has(.report-edit){padding:0}
    /* 渲染后的日报：参照 Obsidian 阅读视图——正文用无衬线、标题分层、列表缩进清楚 */
    .report-paper>:first-child{margin-top:0}
    .report-paper h1{font-size:24px;line-height:1.3;font-weight:650;letter-spacing:-.4px;margin:0 0 20px}
    .report-paper h2{font-size:18px;line-height:1.35;font-weight:650;margin:30px 0 12px;
      padding-bottom:6px;border-bottom:1px solid var(--line)}
    .report-paper h3{font-size:15.5px;font-weight:650;margin:22px 0 8px}
    .report-paper p{margin:0 0 12px}
    .report-paper ol,.report-paper ul{margin:0 0 12px;padding-left:26px}
    .report-paper li{margin:6px 0}
    .report-paper li>ol,.report-paper li>ul{margin:6px 0 4px}
    .report-paper li>ul{list-style:none;padding-left:18px}
    .report-paper ol>li::marker{color:var(--muted);font-weight:600}
    .report-paper strong{font-weight:650}
    .report-paper a{color:var(--link);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--link) 30%,transparent)}
    .report-paper a:hover{border-bottom-color:var(--link)}
    .report-paper blockquote{margin:0 0 16px;padding:8px 14px;border-left:3px solid var(--violet);
      background:var(--surface-soft);color:var(--muted);border-radius:0 6px 6px 0}
    .report-paper code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;
      background:var(--surface-soft);padding:1px 5px;border-radius:4px}
    .report-paper hr{border:0;border-top:1px dashed var(--line);margin:26px 0}
    .report-paper .report-version{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px}
    .report-paper .report-empty{color:var(--muted)}
    /* 日报按 Obsidian 的写法显示：折叠、待办、提示框、表格、代码块、图片 */
    .report-paper .md-doc>:first-child{margin-top:0}
    .report-paper .md-h,.report-paper li.foldable{position:relative}
    .report-paper .fold{position:absolute;left:-22px;top:.35em;width:18px;height:18px;padding:0;border:0;border-radius:4px;
      background:transparent;cursor:pointer;opacity:0;transition:opacity .15s}
    .report-paper .fold::before{content:'';position:absolute;left:6px;top:4px;width:5px;height:5px;
      border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
    .report-paper .fold:hover{background:var(--surface-soft)}
    .report-paper .md-h:hover>.fold,.report-paper li.foldable:hover>.fold,.report-paper .folded>.fold,.report-paper .fold:focus-visible{opacity:1}
    .report-paper .folded>.fold::before{transform:rotate(-45deg);left:5px;top:6px}
    .report-paper li.folded>ul,.report-paper li.folded>ol{display:none}
    .report-paper .fold-hidden{display:none!important}
    @media (hover:none){.report-paper .fold{opacity:.6}}
    .report-paper li.task{list-style:none;position:relative;padding-left:24px;margin-left:-24px}
    .report-paper .task-box{position:absolute;left:0;top:.4em;width:15px;height:15px;box-sizing:border-box;
      border:1.5px solid var(--faint);border-radius:4px}
    .report-paper li.checked>.task-box{background:#6f5fc7;border-color:#6f5fc7}
    .report-paper li.checked>.task-box::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
      border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
    .report-paper li.done>.task-text{text-decoration:line-through;color:var(--muted)}
    .report-paper .callout{--c:#4f78d1;margin:0 0 16px;padding:10px 14px;border-radius:8px;border-left:3px solid var(--c);
      background:color-mix(in srgb,var(--c) 8%,transparent)}
    .report-paper .c-abstract{--c:#1a9bb0}.report-paper .c-tip{--c:#1f9d7a}.report-paper .c-success{--c:#3a9d4f}
    .report-paper .c-question{--c:#c48a12}.report-paper .c-warning{--c:#d9772b}.report-paper .c-danger{--c:#d24b4b}
    .report-paper .c-example{--c:#7b61d1}.report-paper .c-quote{--c:#8a8580}
    .report-paper .callout-title{font-weight:650;color:var(--c);display:flex;align-items:center;gap:8px}
    .report-paper summary.callout-title{cursor:pointer;list-style:none}
    .report-paper summary.callout-title::-webkit-details-marker{display:none}
    .report-paper summary.callout-title::after{content:'';width:5px;height:5px;border-right:1.5px solid currentColor;
      border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
    .report-paper details[open]>summary.callout-title::after{transform:rotate(45deg)}
    .report-paper .callout-body{margin-top:6px}
    .report-paper .callout-body>:last-child{margin-bottom:0}
    .report-paper .md-table{overflow-x:auto;margin:0 0 14px}
    .report-paper table{border-collapse:collapse;min-width:50%;font-size:13.5px;line-height:1.6}
    .report-paper th,.report-paper td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
    .report-paper th{background:var(--surface-soft);font-weight:650}
    .report-paper pre.md-code{margin:0 0 14px;padding:12px 14px;border-radius:8px;background:var(--surface-soft);overflow-x:auto;line-height:1.55}
    .report-paper pre.md-code code{background:none;padding:0;border:0;white-space:pre}
    .report-paper .md-img{position:relative;display:inline-block;max-width:100%;vertical-align:top;margin:4px 0}
    .report-paper .md-img img{display:block;max-width:100%;height:auto;border-radius:6px;cursor:zoom-in}
    .report-paper .fold-more{display:none;margin-left:6px;color:var(--faint);font-weight:400;letter-spacing:1px}
    .report-paper .folded>.fold-more{display:inline}
    .md-preview{border:1px solid var(--line);border-radius:10px;padding:16px 20px 16px 34px;min-height:440px;
      max-height:calc(75vh / var(--zoom,1));overflow:auto}
    @media (max-width:1100px){.edit-split{grid-template-columns:1fr}}
    .lightbox{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:24px;background:rgba(16,14,36,.86);
      cursor:zoom-out;width:calc(100vw / var(--zoom,1));height:calc(100vh / var(--zoom,1))}
    .lightbox.show{display:grid}
    .lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
    .warning-list{margin:0;padding:0;list-style:none}.warning-list li{padding:10px 0;border-top:1px solid var(--line)}
    .check{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}.check:first-child{border-top:0}
    .check-mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--success-bg);color:var(--success);font-size:11px;font-weight:700}
    .check.bad .check-mark{background:var(--danger-bg);color:var(--danger)}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
    th{border-top:0;color:var(--muted);font-size:10px;letter-spacing:.4px;background:var(--surface-alt)}
    .toast{position:fixed;right:24px;bottom:24px;z-index:30;display:none;align-items:center;gap:14px;
      max-width:430px;background:var(--teal);color:#fff;border-radius:10px;padding:13px 15px;box-shadow:0 14px 38px rgba(14,48,48,.25)}
    .toast.show{display:flex;animation:toast-in .2s ease both}@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .toast button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:7px;padding:5px 9px}
    .toast.error{background:#6e2725}
    [hidden]{display:none!important}
    .fb-editor{display:block;width:100%;min-height:150px;border:0;border-radius:0;padding:14px 18px;resize:vertical;line-height:1.6}
    .fb-draft{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 14px}
    .fb-draft:empty{display:none}
    .fb-thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-soft)}
    .fb-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .fb-thumb button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;padding:0;
      background:rgba(16,14,36,.72);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}
    .fb-form.dragging{box-shadow:0 0 0 2px var(--violet)}
    .fb-body{white-space:pre-wrap;margin-top:0}
    .fb-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .fb-images img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
    .guide-link{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;
      border-radius:8px;color:#bcbac9;text-decoration:none;font-size:13px}
    .guide-icon{font-size:15px;line-height:1}
    .guide-link:hover{background:rgba(255,255,255,.06);color:#fff}
    .topbar-actions{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:flex-end}
    .lang-switch{display:flex;gap:2px;background:var(--surface-soft);padding:3px;border-radius:9px;align-self:center}
    .lang-switch button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:700;color:var(--muted)}
    .lang-switch button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
    .theme-toggle{align-self:center;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;
      background:var(--surface-soft);color:var(--muted);display:grid;place-items:center}
    .theme-toggle:hover{color:var(--ink)}
    .theme-toggle .i-sun,:root[data-theme="dark"] .theme-toggle .i-moon{display:none}
    :root[data-theme="dark"] .theme-toggle .i-sun{display:block}
    .report-edit{display:flex;flex-direction:column}
    .report-edit .edit-hint{margin:0;padding:10px 16px;border-bottom:1px solid var(--line);
      background:var(--surface-alt);font-size:11.5px;color:var(--muted)}
    /* 编辑框先给足高度，内容写多了自己往下长，页面跟着滚——不锁死一屏，写起来不憋屈 */
    .report-editor{min-height:60vh}
    .report-editor .cm-editor{height:auto}
    .report-editor .cm-content{min-height:60vh}
    .report-edit .button-row{padding:10px 16px;border-top:1px solid var(--line);
      background:var(--surface-alt);align-items:center}
    /* 用法提示一行放得下就放，放不下省略，鼠标停上去看全文 */
    .md-hint{flex:1;min-width:0;font-size:11px;color:var(--faint);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    @media(max-width:760px){.md-hint{display:none}}
    .style-editor{display:block;width:100%;resize:vertical;
      font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}
    .style-editor{min-height:170px;border:0;border-radius:0;padding:14px 18px}
    .viewas{display:none;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;
      border-radius:10px;background:var(--chip-bg);color:var(--viewas-ink);margin-bottom:16px}
    .viewas.show{display:flex}
    .setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;flex-wrap:wrap}
    .agent-card{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;
      padding:14px 18px;border-top:1px solid var(--line)}
    .agent-card:first-child{border-top:0}
    .agent-card.on{background:linear-gradient(90deg,rgba(201,180,250,.16),rgba(201,180,250,0) 65%)}
    .agent-badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;
      font-size:12px;letter-spacing:.3px;background:var(--surface-soft);color:var(--muted)}
    .agent-card.on .agent-badge{background:var(--nav);color:var(--violet)}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:1px}
    .dot.live{background:#3fae7d}
    .switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
    .switch input{opacity:0;width:0;height:0;min-height:0;position:absolute}
    .switch span{position:absolute;inset:0;border-radius:99px;background:var(--switch-off);transition:.15s;cursor:pointer}
    .switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;
      background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
    .switch input:checked+span{background:var(--nav)}
    .switch input:checked+span:before{transform:translateX(18px)}
    .switch input:focus-visible+span{box-shadow:0 0 0 3px rgba(119,113,166,.3)}
    .folder{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;
      padding:11px 18px;border-top:1px solid var(--line);cursor:pointer}
    .folder:first-child{border-top:0}
    .folder:hover{background:var(--surface-alt)}
    .folder input{width:16px;height:16px;min-height:0;accent-color:var(--nav)}
    .folder-path{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
    .folder-drop{border:0;background:transparent;color:var(--faint);width:24px;height:24px;
      border-radius:6px;font-size:15px;line-height:1;padding:0;opacity:0;flex:none}
    .folder:hover .folder-drop,.folder-drop:focus-visible{opacity:1}
    .folder-drop:hover{background:var(--danger-bg);color:var(--danger)}
    .folder.gone{opacity:.55}
    .folder.gone .folder-path{text-decoration:line-through}
    .folders-gone{padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    .folders-gone button{border:0;background:transparent;color:var(--link);padding:0 2px;font-size:12px}
    .panel-foot{display:flex;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);
      background:var(--surface-alt);flex-wrap:wrap}
    .panel-foot input{flex:1;min-width:220px}
    @media(max-width:900px){
      .shell:not(.sidebar-expanded){grid-template-columns:78px minmax(0,1fr)}
      .shell:not(.sidebar-expanded) .sidebar{padding:22px 10px}
      .shell:not(.sidebar-expanded) .brand{padding:0 8px}
      .shell:not(.sidebar-expanded) .brand-copy,.shell:not(.sidebar-expanded) .brand-name,
      .shell:not(.sidebar-expanded) .nav-label,.shell:not(.sidebar-expanded) .nav button .nav-text,
      .shell:not(.sidebar-expanded) .sidebar-foot span,.shell:not(.sidebar-expanded) .guide-text{display:none}
      .shell:not(.sidebar-expanded) .nav button{justify-content:center;min-height:44px}
      .shell:not(.sidebar-expanded) .nav button .count{display:none}
      .shell.sidebar-expanded{grid-template-columns:232px minmax(0,1fr)}
      .shell.sidebar-expanded .sidebar{padding:26px 18px 20px}.topbar{padding:17px 22px;align-items:flex-start}.toolbar{max-width:480px}
      main{padding:24px 22px 64px}.two-col,.report-layout{grid-template-columns:1fr}.report-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.report-nav button{width:auto;white-space:nowrap}
      .review-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:640px){
      .shell{display:block}.sidebar{position:fixed;z-index:20;top:auto;bottom:0;width:100%;height:62px;padding:7px 8px;background:var(--nav-deep)}
      .brand-row,.nav-label,.sidebar-foot,.sidebar-toggle{display:none}.nav{grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}.nav button{padding:6px 3px;display:grid;place-items:center;gap:2px;font-size:10px}.nav button .nav-text{display:block}.nav .count{font-size:9px;min-width:18px;padding:0 4px}
      .topbar{position:static;display:block;padding:18px 16px}.toolbar{margin-top:15px;display:grid;grid-template-columns:1fr 1fr}.toolbar .field:first-child{grid-column:1/-1}.toolbar input,.toolbar select{width:100%;max-width:none}
      main{padding:20px 14px 92px}.hero{padding:23px 21px}.hero h2{font-size:25px}.hero .hero-action{position:static;margin-top:18px}.metrics{gap:8px}.metric{padding:14px}.metric strong{font-size:23px}
      .two-col{display:block}.two-col>div+div{margin-top:18px}.task-row{grid-template-columns:1fr}.task-actions{justify-content:flex-start}.report-paper{padding:22px 18px}.toast{left:14px;right:14px;bottom:76px}
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" data-i18n-aria="nav_aria">
    <div class="brand-row">
      <div class="brand"><div class="brand-mark">f°</div><div><div class="brand-name">fecho</div><div class="brand-copy">work, remembered</div></div></div>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true" data-i18n-aria="sidebar_collapse"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only" data-i18n="sidebar_collapse"></span></button>
    </div>
    <div class="nav-label">Workspace</div>
    <nav class="nav">
      <button class="active" data-view="today"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3M16 2v3M3.5 9h17M4 5.5h16a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_today"></span><span class="count" id="nav-today">—</span></button>
      <button data-view="review"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 12.5 2 2 4-4M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_review"></span><span class="count" id="nav-review">—</span></button>
      <button data-view="tasks"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_tasks"></span><span class="count" id="nav-tasks">—</span></button>
      <button data-view="reports"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7l-4-4Zm0 0v4h4M9 12h6M9 16h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_reports"></span><span class="count" id="nav-reports">—</span></button>
      <button data-view="system"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_system"></span><span class="count" id="nav-system">—</span></button>
      <button data-view="settings" data-cloud-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8.5-3a8.5 8.5 0 0 0-.13-1.4l2-1.5-2-3.5-2.4.9a8.5 8.5 0 0 0-2.4-1.4L15.2 2h-4l-.37 2.6a8.5 8.5 0 0 0-2.4 1.4l-2.4-.9-2 3.5 2 1.5a8.5 8.5 0 0 0 0 2.8l-2 1.5 2 3.5 2.4-.9a8.5 8.5 0 0 0 2.4 1.4l.37 2.6h4l.37-2.6a8.5 8.5 0 0 0 2.4-1.4l2.4.9 2-3.5-2-1.5c.08-.46.13-.93.13-1.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_settings"></span><span class="count" id="nav-settings">—</span></button>
      <button data-view="feedback" data-cloud-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5A8.3 8.3 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_feedback"></span><span class="count" id="nav-feedback">—</span></button>
      <button data-view="admin" data-admin-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.3 2.9 8.3 7 9.5 4.1-1.2 7-5.2 7-9.5V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_admin"></span><span class="count" id="nav-admin">—</span></button>
    </nav>
    <a class="guide-link" href="/guide" target="_blank" rel="noopener"><span class="guide-icon" aria-hidden="true">↗</span><span class="guide-text" data-i18n="nav_guide"></span></a>
    <div class="sidebar-foot"><div class="connection"><i class="pulse"></i><span id="connection-copy" data-i18n="connection_local"></span></div></div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <div class="page-title"><h1 id="page-title"></h1><p id="page-subtitle"></p></div>
      </div>
      <div class="topbar-actions">
        <div class="toolbar" data-i18n-aria="filters_aria">
          <div class="field"><label for="work-date" data-i18n="filter_date"></label><input id="work-date" type="date"></div>
          <div class="field"><label for="agent-filter" data-i18n="filter_agent"></label><select id="agent-filter"><option value=""></option></select></div>
          <div class="field"><label for="source-filter" data-i18n="filter_source"></label><select id="source-filter"><option value=""></option></select></div>
          <div class="field"><label for="status-filter" data-i18n="filter_status"></label><select id="status-filter"><option value=""></option></select></div>
          <button class="btn" id="reload-day" type="button" data-i18n="reload"></button>
        </div>
        <div class="lang-switch" role="group" data-i18n-aria="lang_aria"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div>
        <button class="theme-toggle" id="theme-toggle" type="button" data-i18n-aria="theme_aria"><svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z" fill="currentColor"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <main>
      <div id="error-state" class="error-state"><span id="error-copy"></span><button class="btn small" id="retry" data-i18n="retry"></button></div>
      <div id="viewas" class="viewas" role="status"><span id="viewas-copy"></span><button class="btn small" id="viewas-exit" data-i18n="viewas_exit"></button></div>
      <div id="loading" class="loading show"><div class="spinner"></div><span id="loading-copy" data-i18n="loading"></span></div>

      <section class="view active" data-page="today" aria-labelledby="today-heading">
        <div class="hero"><div class="eyebrow" id="today-date">WORK LOG</div><h2 id="today-heading" data-i18n="hero_default"></h2><p id="today-summary" data-i18n="hero_loading"></p><button class="btn primary hero-action" data-go="review" data-i18n="hero_review"></button></div>
        <div class="metrics" id="metrics"></div>
        <div class="two-col">
          <div><div class="section-head"><div><h2 data-i18n="today_tasks"></h2><p data-i18n="today_tasks_sub"></p></div></div><div class="panel" id="today-tasks"></div></div>
          <div><div class="section-head"><div><h2 data-i18n="attention"></h2><p data-i18n="attention_sub"></p></div></div><div class="panel" id="attention"></div></div>
        </div>
        <div class="section-head"><div><h2 data-i18n="timeline"></h2><p data-i18n="timeline_sub"></p></div></div><div class="panel" id="timeline"></div>
      </section>

      <section class="view" data-page="review" aria-labelledby="review-heading">
        <div class="section-head"><div><h2 id="review-heading" data-i18n="review_heading"></h2><p data-i18n="review_sub"></p></div><span class="tag" id="review-total">0</span></div>
        <div class="panel" id="review-list"></div>
        <div class="section-head"><div><h2 data-i18n="hidden_heading"></h2><p data-i18n="hidden_sub"></p></div></div>
        <div class="panel" id="hidden-list"></div>
      </section>

      <section class="view" data-page="tasks" aria-labelledby="tasks-heading">
        <div class="section-head"><div><h2 id="tasks-heading" data-i18n="tasks_heading"></h2><p data-i18n="tasks_sub"></p></div>
          <div class="segmented" id="task-tabs"><button class="active" data-task-status="all" data-i18n="tab_all"></button><button data-task-status="open" data-i18n="tab_open"></button><button data-task-status="done" data-i18n="tab_done"></button><button data-task-status="merged" data-i18n="tab_merged"></button></div></div>
        <div class="panel" id="task-list"></div>
      </section>

      <section class="view" data-page="reports" aria-labelledby="reports-heading">

<!-- 日报编辑器。源码 editor/entry.js，产物已提交，部署时不用装 node -->
<script src="/vendor/cm6/editor.min.js"></script>
<script>
  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const state = {data:null, view:'today', taskStatus:'all', reportTab:'daily', undo:null, toastTimer:null,
    me:null, viewAs:null, editing:false, settings:{agents:[], folders:[]}, admin:null, style:null,
    prevView:null, feedback:{images:[], mine:[], all:null}};

  // ---- 界面语言 ----
  // 记在浏览器里，登录页、onboard 页、面板共用同一个 key。默认中文。
  const I18N = JSON.parse(document.getElementById('i18n').textContent);
  const LANG_KEY = 'fecho-lang';
  let lang = (()=>{ try{ return localStorage.getItem(LANG_KEY)==='en'?'en':'zh'; }catch(_){ return 'zh'; } })();
  function t(key, vars={}){
    const text=(I18N[lang]||{})[key] ?? I18N.zh[key] ?? key;
    return text.replace(/\{(\w+)\}/g,(_,name)=>vars[name] ?? '');
  }
  function applyStatic(){
    document.documentElement.lang = lang==='en' ? 'en' : 'zh-CN';
    document.title = t('doc_title');
    $$('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
    $$('[data-i18n-placeholder]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPlaceholder); });
    $$('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label',t(el.dataset.i18nAria)); });
    $$('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    const shell=$('.shell');
    if(shell&&typeof applySidebar==='function') applySidebar(shell.classList.contains('sidebar-collapsed'),{persist:false});
  }
  function setLang(next){
    lang=next; try{ localStorage.setItem(LANG_KEY,next); }catch(_){}
    applyStatic(); switchView(state.view,{scroll:false});
    if(state.me&&state.me.cloud) $('#connection-copy').textContent=state.me.display_name||state.me.author;
    showViewAs();
    if(state.data){ hydrateFilters(); renderAll(); }
    if(state.me&&state.me.cloud){ renderSettings(); if(state.admin) renderAdmin(); if(state.style) showStyle(state.style); renderFeedbackDraft(); renderFeedbackMine(); if(state.feedback.all) renderFeedbackAll(); }
  }

  async function request(path, options={}){
    const response = await fetch(path, options);
    let payload = {};
    try { payload = await response.json(); } catch (_) { payload = {}; }
    if (!response.ok) throw new Error(payload.error || payload.detail || t('err_request',{status:response.status}));
    if (payload.ok === false) throw new Error(payload.error || t('err_operation'));
    return payload;
  }
  const post = (path, body) => request(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})});

  function localDate(){
    const parts=new Intl.DateTimeFormat('en',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const values=Object.fromEntries(parts.map(part=>[part.type,part.value]));
    return `${values.year}-${values.month}-${values.day}`;
  }
  // 切日期：看过的旧日期直接用上次读到的，不再去服务器读；只有今天会自动刷新（打开页面、每分钟、切回这个标签页）。
  // 服务器这边本来就只是读已经记下的进展和日报，不会重新整理；真要重出日报点「重新生成」。
  const isToday=date=>date===localDate();
  const cacheKey=date=>((state.viewAs||{}).author||'me')+'|'+date;
  async function loadDashboard({quiet=false, useCache=false}={}){
    const date = $('#work-date').value || localDate();
    const cached=(state.cache||{})[cacheKey(date)];
    if(useCache&&cached){
      state.data=cached; hydrateFilters(); renderAll();
      if(isToday(date)) loadDashboard({quiet:true});      // 今天的记录可能又多了，后台悄悄补一次
      return;
    }
    if (!quiet){ $('#loading-copy').textContent=t(isToday(date)?'loading':'loading_day',{date}); $('#loading').classList.add('show'); }
    $('#error-state').classList.remove('show');
    try{
      const data = await request(state.viewAs
        ? `/api/admin/dashboard?author=${encodeURIComponent(state.viewAs.author)}&date=${encodeURIComponent(date)}`
        : `/api/dashboard?date=${encodeURIComponent(date)}`);
      // 等回来的时候人可能已经切到别的日期了：存下来，但别画到页面上
      if(data.date!==($('#work-date').value||localDate())){ (state.cache||(state.cache={}))[cacheKey(data.date)]=data; return; }
      state.data=data; hydrateFilters(); renderAll();
    }catch(error){ showError(error.message); }
    finally{ $('#loading').classList.remove('show'); }
  }

  function hydrateFilters(){
    const data=state.data;
    fillSelect($('#agent-filter'), data.filters.agents, t('all'));
    fillSelect($('#source-filter'), data.filters.ingestion_methods, t('all'));
    const statusLabels=Object.fromEntries(['done','wip','blocked','unknown'].map(s=>[s,t('status_'+s)]));
    fillSelect($('#status-filter'), data.filters.completion_statuses, t('all'), statusLabels);
  }
  function fillSelect(select, values, first, labels={}){
    const current=select.value; select.innerHTML=`<option value="">${esc(first)}</option>`+
      values.map(v=>`<option value="${esc(v)}">${esc(labels[v]||v)}</option>`).join('');
    if(values.includes(current)) select.value=current;
  }
  function matches(update){
    const agent=$('#agent-filter').value, source=$('#source-filter').value, status=$('#status-filter').value;
    return (!agent || update.source_agent===agent) && (!source || update.ingestion_method===source) &&
      (!status || update.completion_status===status);
  }
  function statusTag(status){ const known=['done','wip','blocked','unknown'].includes(status); return `<span class="tag ${esc(status)}">${known?esc(t('status_'+status)):esc(status)}</span>`; }
  // 有模型起的短名就用短名：自由任务的标题是第一条进展的原文，当名字认不出是哪件事
  function issueLabel(task){ const name=task.alias||task.title; return task.issue_key ? `${esc(task.issue_key)} · ${esc(name)}` : `${esc(name)} · ${esc(t('freeform'))}`; }
  function empty(title, copy){ return `<div class="empty"><strong>${esc(title)}</strong>${esc(copy)}</div>`; }

  function renderAll(){
    const d=state.data, o=d.overview;
    (state.cache||(state.cache={}))[cacheKey(d.date)]=d;     // 改完东西服务器回的最新数据也记下，切回这天看到的是新的
    $('#nav-today').textContent=o.updates; $('#nav-review').textContent=d.review.items.length;
    $('#nav-tasks').textContent=d.tasks.items.filter(t=>t.status==='open').length;
    $('#nav-reports').textContent=d.reports.dirty?'!':(d.reports.daily?'1':'—');
    $('#nav-system').textContent=d.system.scan_runs.some(r=>r.status==='failed')?'!':'✓';
    renderToday(); renderReview(); renderTasks(); renderReports(); renderSystem();
  }

  function renderToday(){
    const d=state.data,o=d.overview;
    $('#today-date').textContent=d.date.replaceAll('-',' / ');
    const visibleTasks=d.today.tasks.map(t=>({...t,updates:t.updates.filter(matches)})).filter(t=>t.updates.length);
    $('#today-heading').textContent=o.updates ? t(isToday(d.date)?'today_heading_n':'day_heading_n',{n:o.tasks}) : t('today_heading_none');
    $('#today-summary').textContent=o.updates ? t('today_summary_n',{updates:o.updates, agents:new Set(d.today.tasks.flatMap(x=>x.updates.map(u=>u.source_agent))).size, review:d.review.items.length}) : t('today_summary_none');
    $('#metrics').innerHTML=[['metric_updates',o.updates,''],['metric_tasks',o.tasks,''],['metric_review',d.review.items.length,'attention'],['metric_hidden',o.hidden,'']]
      .map(([label,value,kind])=>`<div class="metric ${kind}"><strong>${value}</strong><span>${esc(t(label))}</span></div>`).join('');
    $('#today-tasks').innerHTML=visibleTasks.length?visibleTasks.map(task=>{
      const statuses=task.updates.map(u=>u.completion_status); const taskStatus=statuses.includes('blocked')?'blocked':statuses.includes('wip')?'wip':statuses.every(s=>s==='done')?'done':'unknown';
      return `<details class="timeline" open><summary><span><span class="item-title">${issueLabel(task)}</span><span class="meta">${esc(t('n_updates',{n:task.updates.length}))}</span></span>${statusTag(taskStatus)}</summary><div class="timeline-body">${task.updates.map(u=>`<div class="progress-line"><div>${esc(u.content_md)}</div><div class="meta">${esc(u.source_agent)}${(u.meta||{}).entrypoint?' · '+esc(t('entry_'+u.meta.entrypoint)):''} · ${esc(u.ingestion_method)} · ${esc((u.created_at||'').slice(11,16))} ${statusTag(u.completion_status)}</div></div>`).join('')}</div></details>`;
    }).join(''):empty(t('empty_filter'),t('empty_filter_sub'));
    const notices=[];
    if(d.review.items.length) notices.push(`<div class="item"><div class="item-title">${esc(t('notice_review',{n:d.review.items.length}))}</div><div class="meta">${esc(t('notice_review_sub'))}</div></div>`);
    if(d.reports.dirty) notices.push(`<div class="item"><div class="item-title">${esc(t('notice_dirty'))}</div><div class="meta">${esc(t('notice_dirty_sub'))}</div></div>`);
    if(o.hidden) notices.push(`<div class="item"><div class="item-title">${esc(t('notice_hidden',{n:o.hidden}))}</div><div class="meta">${esc(t('notice_hidden_sub'))}</div></div>`);
    $('#attention').innerHTML=notices.join('')||empty(t('empty_attention'),t('empty_attention_sub'));
    $('#timeline').innerHTML=d.timeline.groups.length?d.timeline.groups.map(group=>`<details class="timeline"><summary><span class="item-title">${group.issue_key?`<a href="https://mobius.feedmob.com/issue/${esc(group.issue_key)}" target="_blank" rel="noreferrer">${esc(group.issue_key)}</a> · `:''}${esc(group.title)}</span><span class="meta">${esc(t('n_items',{n:Object.values(group.days).flat().length}))}</span></summary><div class="timeline-body">${Object.entries(group.days).sort().reverse().map(([date,items])=>`<div class="progress-line"><b>${esc(date)}</b>${items.map(text=>`<div>${esc(text)}</div>`).join('')}</div>`).join('')}</div></details>`).join(''):empty(t('empty_timeline'),t('empty_timeline_sub'));
  }

  function issueOptions(selected){
    return `<option value="" ${selected?'':'selected'}>${esc(t('freeform'))}</option>`+state.data.issues.items.map(issue=>`<option value="${esc(issue.issue_key)}" ${issue.issue_key===selected?'selected':''}>${esc(issue.issue_key)} · ${esc(issue.title)}</option>`).join('');
  }
  function renderReview(){
    const items=state.data.review.items.filter(matches); $('#review-total').textContent=t('n_items',{n:items.length});
    $('#review-list').innerHTML=items.length?items.map(item=>`<article class="review-card" data-update="${esc(item.update_id)}" data-old-issue="${esc(item.issue_key||'')}"><div class="review-grid"><div><div class="item-body">${esc(item.content)}</div><div class="meta"><span class="tag ${esc(item.confidence)}">${esc(t('confidence_'+item.confidence))}</span><span>${esc(item.method)}</span><span>${esc(item.source_agent)} · ${esc(item.ingestion_method)}</span><span>${esc((item.created_at||'').slice(11,16))}</span>${statusTag(item.completion_status)}</div></div><div class="review-actions"><label class="field"><span style="font-size:10px;color:var(--muted);font-weight:700">${esc(t('assign_to'))}</span><select data-role="issue">${issueOptions(item.issue_key)}</select></label><textarea data-role="content" aria-label="${esc(t('fix_content_aria'))}">${esc(item.content)}</textarea><div class="button-row"><button class="btn primary small" data-action="confirm-update">${esc(t('confirm_lock'))}</button></div></div></div></article>`).join(''):empty(t('empty_review'),t('empty_review_sub'));
    const hidden=state.data.hidden.items;
    $('#hidden-list').innerHTML=hidden.length?hidden.map(item=>`<div class="item item-head"><div><div class="item-body">${esc(item.content_md)}</div><div class="meta">${esc(item.status)} ${item.k?'· '+esc(item.k):''}</div></div><button class="btn small" data-action="restore" data-id="${esc(item.update_id)}">${esc(t('restore'))}</button></div>`).join(''):empty(t('empty_hidden'),t('empty_hidden_sub'));
  }

  function renderTasks(){
    $$('#task-tabs button').forEach(button=>button.classList.toggle('active',button.dataset.taskStatus===state.taskStatus));
    const hasGlobalFilter=$('#agent-filter').value||$('#source-filter').value||$('#status-filter').value;
    const tasks=state.data.tasks.items.filter(x=>(state.taskStatus==='all'||x.status===state.taskStatus)&&
      (!hasGlobalFilter||x.updates.some(matches)));
    $('#task-list').innerHTML=tasks.length?tasks.map(task=>{
      const targets=state.data.tasks.items.filter(x=>x.task_id!==task.task_id&&x.status!=='merged').map(x=>`<option value="${esc(x.task_id)}">${issueLabel(x)}</option>`).join('');
      const action=task.status==='open'?`<button class="btn small" data-action="complete-task" data-id="${esc(task.task_id)}">${esc(t('complete'))}</button>`:task.status==='done'?`<button class="btn small" data-action="reopen-task" data-id="${esc(task.task_id)}">${esc(t('reopen'))}</button>`:'';
      const statusText=['open','done','merged'].includes(task.status)?t('task_status_'+task.status):task.status;
      return `<div class="task-row"><div><div class="item-title">${issueLabel(task)}</div><div class="item-body">${esc(task.last_progress||t('no_progress'))}</div><div class="meta"><span class="tag ${task.status==='done'?'done':''}">${esc(statusText)}</span><span>${esc(t('n_updates',{n:task.update_count}))}</span><span>${esc(t('last_updated',{time:(task.last_update||'').slice(0,16).replace('T',' ')}))}</span></div></div><div class="task-actions">${action}${task.status!=='merged'&&targets?`<select aria-label="${esc(t('merge_aria'))}" data-merge-target="${esc(task.task_id)}"><option value="">${esc(t('merge_into'))}</option>${targets}</select><button class="btn small" data-action="merge-task" data-id="${esc(task.task_id)}">${esc(t('merge'))}</button>`:''}</div></div>`;
    }).join(''):empty(t('empty_tasks'),t('empty_tasks_sub'));
  }

  // ---- Markdown → HTML ----
  // 日报是我们自己的代码拼出来的，语法范围很小（标题、有序/嵌套列表、加粗、链接、
  // 引用、行内代码），所以不引外部库：面板要保持零外部依赖，断网也能打开。
  // 内容来自模型输出，一律先转义再加标记；链接只放行 http(s)，挡掉 javascript: 这类。
  const MD_IMG=/!\[([^\]]*)\]\(((?:https?:\/\/|\/api\/reports\/images\/)[^\s)]+)\)/g;   // 只放行 http(s) 和本站传上来的图
  let mdImages=0;
  function mdInline(text){
    // 行内代码先换成占位符，免得里面的 ** 被当成加粗。占位符用私有区字符的
    // 转义写法——文件里不能夹原始控制字符，浏览器解析 script 时会把它们换掉。
    const codes=[];
    let s=esc(text).replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return ''+(codes.length-1)+'';});
    // 图片：![说明|宽度](地址)，宽度写法和 Obsidian 一样。按出现顺序编号，编辑时拖大小靠编号找回原文那一处
    s=s.replace(MD_IMG,(_,alt,url)=>{
      const parts=alt.split('|'); let width='';
      if(parts.length>1&&/^\d+(x\d+)?$/.test(parts[parts.length-1].trim())) width=parts.pop().trim().split('x')[0];
      return `<span class="md-img" data-img="${mdImages++}"><img src="${url}" alt="${parts.join('|')}"${width?` style="width:${width}px"`:''} loading="lazy"></span>`;
    });
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    // 斜体要放在加粗后面：先把 ** 收走，剩下的单个 * 才是斜体。~~删除线~~ 一并支持
    s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
    s=s.replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
    return s.replace(/(\d+)/g,(_,i)=>'<code>'+codes[+i]+'</code>');
  }

  // Obsidian 的提示框类型和别名，归成几种颜色
  const CALLOUT_KIND={note:'note',info:'note',todo:'note',abstract:'abstract',summary:'abstract',tldr:'abstract',
    tip:'tip',hint:'tip',important:'tip',success:'success',check:'success',done:'success',question:'question',help:'question',
    faq:'question',warning:'warning',caution:'warning',attention:'warning',failure:'danger',fail:'danger',missing:'danger',
    danger:'danger',error:'danger',bug:'danger',example:'example',quote:'quote',cite:'quote'};
  const TABLE_SEP=/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  const FENCE=/^\s*(`{3,}|~{3,})/;
  function tableCells(row){
    let s=row.trim();
    if(s.startsWith('|')) s=s.slice(1);
    if(s.endsWith('|')&&!s.endsWith('\\|')) s=s.slice(0,-1);
    return s.split(/(?<!\\)\|/).map(cell=>cell.trim().replace(/\\\|/g,'|'));
  }

  function md(src){
    mdImages=0;
    return '<div class="md-doc">'+mdBlocks(String(src||'').replace(/\r\n?/g,'\n').split('\n'))+'</div>';
  }

  function mdBlocks(lines){
    const out=[], lists=[];              // lists: 当前打开的列表栈 {indent, tag}
    let para=[], quote=[];
    const flushPara=()=>{ if(para.length){ out.push('<p>'+mdInline(para.join(' '))+'</p>'); para=[]; } };
    const flushQuote=()=>{ if(quote.length){ out.push('<blockquote>'+quote.map(mdInline).join('<br>')+'</blockquote>'); quote=[]; } };
    const closeLists=(indent)=>{ while(lists.length && lists[lists.length-1].indent>=indent) out.push('</li></'+lists.pop().tag+'>'); };
    const flushAll=()=>{ flushPara(); flushQuote(); closeLists(0); };

    for(let i=0;i<lines.length;i++){
      const line=lines[i].replace(/\s+$/,'');

      // 整行的 HTML 注释不显示。编辑器把表格列宽行高存成 <!-- fecho-table ... -->
      // 跟在表格后面，看日报时不该冒出来
      if(/^<!--[\s\S]*-->$/.test(line.trim())) continue;

      // 代码块：原样显示，里面的符号一律不当标记
      const fence=line.match(FENCE);
      if(fence){
        flushAll(); const body=[];
        for(i++;i<lines.length&&!lines[i].trim().startsWith(fence[1]);i++) body.push(lines[i]);
        out.push(`<pre class="md-code"><code>${esc(body.join('\n'))}</code></pre>`);
        continue;
      }
      if(!line.trim()){ flushAll(); continue; }

      const h=line.match(/^(#{1,6})\s+(.*)$/);
      if(h){ flushAll(); const n=h[1].length; out.push(`<h${n} class="md-h">${mdInline(h[2])}</h${n}>`); continue; }

      if(/^\s*[─—-]{3,}\s*$/.test(line)){ flushAll(); out.push('<hr>'); continue; }

      // 表格：这一行带 |，下一行是 |---|
      if(line.includes('|')&&i+1<lines.length&&lines[i+1].includes('|')&&TABLE_SEP.test(lines[i+1])){
        flushAll();
        const head=tableCells(line);
        const align=tableCells(lines[i+1]).map(c=>/^:-+:$/.test(c)?'center':/-+:$/.test(c)?'right':'');
        const cell=(tag,text,k)=>`<${tag}${align[k]?` style="text-align:${align[k]}"`:''}>${mdInline(text)}</${tag}>`;
        const rows=[];
        for(i+=2;i<lines.length&&lines[i].includes('|')&&lines[i].trim();i++) rows.push(tableCells(lines[i]));
        i--;
        out.push(`<div class="md-table"><table><thead><tr>${head.map((c,k)=>cell('th',c,k)).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${head.map((_,k)=>cell('td',r[k]||'',k)).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }

      // 提示框：> [!note] 标题；带 - 默认折叠，带 + 默认展开
      const callout=!quote.length&&line.match(/^>\s?\[!(\w+)\]([+-]?)\s*(.*)$/);
      if(callout){
        flushPara(); closeLists(0);
        const body=[];
        for(i++;i<lines.length&&/^>/.test(lines[i]);i++) body.push(lines[i].replace(/^>\s?/,''));
        i--;
        const name=callout[1], kind=CALLOUT_KIND[name.toLowerCase()]||'note';
        const title=callout[3]?mdInline(callout[3]):esc(name.charAt(0).toUpperCase()+name.slice(1).toLowerCase());
        const inner=body.some(l=>l.trim())?`<div class="callout-body">${mdBlocks(body)}</div>`:'';
        out.push(callout[2]
          ?`<details class="callout c-${kind}"${callout[2]==='+'?' open':''}><summary class="callout-title">${title}</summary>${inner}</details>`
          :`<div class="callout c-${kind}"><div class="callout-title">${title}</div>${inner}</div>`);
        continue;
      }

      const q=line.match(/^>\s?(.*)$/);
      if(q){ flushPara(); closeLists(0); quote.push(q[1]); continue; }

      const li=line.match(/^(\s*)(\d+)\.\s+(.*)$/) || line.match(/^(\s*)([*\-•])\s+(.*)$/);
      if(li){
        flushPara(); flushQuote();
        const indent=li[1].replace(/\t/g,'    ').length, ordered=/^\d+$/.test(li[2]), tag=ordered?'ol':'ul';
        closeLists(indent+1);            // 比这一项缩进更深的都收掉
        const top=lists[lists.length-1];
        // 待办：[ ] 没做；[x] 做完（划掉）；方括号里放别的字符（[/] [-] [a]…）打勾但不划掉，和 Obsidian 一样
        const task=li[3].match(/^\[(.)\](?:\s+(.*))?$/);
        const mark=task&&task[1];
        const cls=!task?'':mark===' '?'task':/^[xX]$/.test(mark)?'task checked done':'task checked';
        const open=cls?`<li class="${cls}" data-task="${esc(mark)}">`:'<li>';
        if(top && top.indent===indent && top.tag===tag){ out.push('</li>'+open); }
        else{
          if(top && top.indent===indent) out.push('</li></'+lists.pop().tag+'>');
          // 保留原编号：Blocked 下面的「2.」不能被重新数成「1.」
          out.push(`<${tag}${ordered&&li[2]!=='1'?` start="${li[2]}"`:''}>`+open);
          lists.push({indent, tag});
        }
        out.push(task?`<span class="task-box"></span><span class="task-text">${mdInline(task[2]||'')}</span>`:mdInline(li[3]));
        continue;
      }

      if(lists.length){ out.push(' '+mdInline(line.trim())); continue; }   // 列表项的续行
      flushQuote(); para.push(line.trim());
    }
    flushAll();
    return out.join('');
  }

  // 有子项的列表项、标题：左边加折叠箭头（悬停出现，和 Obsidian 一样）
  // 折起来之后在后面显示「…」，提醒这里藏着东西
  function enhanceMd(root){
    if(!root) return;
    const button=`<button type="button" class="fold" aria-expanded="true" aria-label="${esc(t('fold'))}"></button>`;
    const more='<span class="fold-more" aria-hidden="true">…</span>';
    root.querySelectorAll('li').forEach(li=>{
      const child=li.querySelector(':scope>ul,:scope>ol');
      if(child&&!li.querySelector(':scope>.fold')){ li.classList.add('foldable'); li.insertAdjacentHTML('afterbegin',button); child.insertAdjacentHTML('beforebegin',more); }
    });
    root.querySelectorAll('.md-h').forEach(h=>{ if(!h.querySelector(':scope>.fold')){ h.insertAdjacentHTML('afterbegin',button); h.insertAdjacentHTML('beforeend',more); } });
  }
  // 折起一个标题 = 藏起它后面、直到下一个同级或更高级标题之前的内容。里面折着的小标题展开外层后仍保持折着
  function applyHeadingFolds(container){
    let hide=null;
    for(const el of container.children){
      const m=/^H([1-6])$/.exec(el.tagName), level=m?+m[1]:null;
      if(level!==null&&hide!==null&&level<=hide) hide=null;
      el.classList.toggle('fold-hidden',hide!==null);
      if(level!==null&&hide===null&&el.classList.contains('folded')) hide=level;
    }
  }
  // ---- 看日报时记住折叠状态：按人、日期、标签页各记一份；内容变了就作废，不把折叠套到别的地方 ----
  const FOLD_KEY='fecho-folds';
  const foldKey=()=>cacheKey(state.data.date)+'|'+state.reportTab;
  function hashText(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return String(h); }
  function foldHosts(root){ return [...root.querySelectorAll('.fold')].map(button=>button.parentElement); }
  function readFolds(){ try{ return JSON.parse(localStorage.getItem(FOLD_KEY)||'{}')||{}; }catch(_){ return {}; } }
  function saveFolds(){
    const root=$('#report-content'); if(!root||state.editing) return;
    const folded=foldHosts(root).map((host,i)=>host.classList.contains('folded')?i:-1).filter(i=>i>=0);
    const all=readFolds(), key=foldKey();
    delete all[key];
    if(folded.length) all[key]={sig:state.reportSig, folded};
    const keys=Object.keys(all); keys.slice(0,Math.max(0,keys.length-60)).forEach(k=>delete all[k]);   // 只留最近 60 份
    try{ localStorage.setItem(FOLD_KEY,JSON.stringify(all)); }catch(_){}
  }
  function restoreFolds(root){
    const saved=readFolds()[foldKey()];
    if(!saved||saved.sig!==state.reportSig) return;
    const hosts=foldHosts(root);
    (saved.folded||[]).forEach(i=>{ const host=hosts[i]; if(!host) return; host.classList.add('folded'); host.querySelector(':scope>.fold').setAttribute('aria-expanded','false'); });
    root.querySelectorAll('.md-doc,.callout-body').forEach(applyHeadingFolds);
  }

  // ---- 改日报的编辑框：和 Obsidian 一样，回车延续列表、Tab 缩进、编号自动重排 ----
  // 这几个函数只算文字，不碰页面，方便单独测
  function openLightbox(src, alt){
    let box=$('#lightbox');
    if(!box){ box=document.createElement('div'); box.id='lightbox'; box.className='lightbox'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.innerHTML='<img alt="">'; document.body.appendChild(box); }
    box.setAttribute('aria-label',t('img_view'));
    const img=box.querySelector('img'); img.src=src; img.alt=alt||'';
    box.classList.add('show');
  }
  function closeLightbox(){ const box=$('#lightbox'); if(box) box.classList.remove('show'); }
  async function uploadReportImages(files){
    if(state.viewAs){ toast(t('toast_readonly'),null,true); return; }
    for(const file of files){
      try{
        if(!FB_TYPES.test(file.type)) throw new Error(t('fb_bad_type'));
        toast(t('img_uploading'));
        const blob=file.size<=FB_TARGET_BYTES?file:await shrinkImage(file);
        const dataUrl=await readAsDataURL(blob);
        const r=await post('/api/reports/images',{data:dataUrl.split(',')[1]});
        FechoEditor.insert(`![${t('img_alt')}|480](${r.url})`);
        toast(t('img_inserted'));

  function toggleQuickApiHelp(){

    if(!help||!anchor) return;
    if(!help.hidden){ help.hidden=true; return; }
    help.innerHTML=t('quick_api_help');                 // 文案里有 <b>，不转义
    if(help.parentElement!==document.body) document.body.appendChild(help);

    const width=Math.min(250,Math.max(180,innerWidth-16));
    help.style.width=width+'px';
    help.style.left=Math.min(Math.max(8,box.left),Math.max(8,innerWidth-width-8))+'px';
    help.style.top=(box.bottom+8)+'px';
    help.hidden=false;
    const shown=help.getBoundingClientRect();           // 贴着屏幕底就往上翻

  const quickApiText=d=>`Base URL: ${d.base_url}\nAPI Key: ${d.api_key}\nOpenAPI: ${d.openapi_url}\nAuthorization: Bearer ${d.api_key}`;
  function copyTextFallback(text){
    const area=document.createElement('textarea');
    area.value=text; area.setAttribute('readonly','');
    area.style.position='fixed'; area.style.opacity='0';
    document.body.appendChild(area); area.focus(); area.select();
    const ok=document.execCommand('copy'); area.remove();
    if(!ok) throw new Error(t('err_operation'));
  }
  async function copyQuickApi(){
    const help=$('#quick-api-help-text'); if(help) help.hidden=true;
    if(state.viewAs){ toast(t('toast_readonly'),null,true); return; }
    const button=$('#quick-api-open'); if(button) button.disabled=true;
    const pending=post('/api/quick-api/credentials',{});
    try{
      let copied=false;
      // 剪贴板的授权只在点击那一刻有效。所以先把一个 Promise 交给 ClipboardItem，
      // 等请求回来它自己填进去——先 await 再写就已经过期了
      if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
        try{
          const blob=pending.then(d=>new Blob([quickApiText(d)],{type:'text/plain'}));
          await navigator.clipboard.write([new ClipboardItem({'text/plain':blob})]);
          copied=true;
        }catch(_){}
      }
      if(!copied){
        const text=quickApiText(await pending);
        if(navigator.clipboard&&navigator.clipboard.writeText){
          try{ await navigator.clipboard.writeText(text); copied=true; }catch(_){}
        }
        if(!copied) copyTextFallback(text);
      }
      await pending;                                     // 请求失败要报出来，不能假装复制成功
      toast(t('quick_api_copied'));
    }catch(error){ toast(error.message||t('err_operation'),null,true); }
    finally{ if(button) button.disabled=false; }
  }
