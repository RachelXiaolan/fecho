<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fecho</title>
  <link rel="icon" href="/assets/fecho-mark.svg" type="image/svg+xml">
  <script id="theme-boot">try{var s=localStorage.getItem('fecho-theme');document.documentElement.dataset.theme=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(_){document.documentElement.dataset.theme='light';}</script>
  <style>
    :root{
      --nav:#5d526b;--nav-deep:#4b4057;--nav-text:#fffdf9;--violet:#d8c6dc;
      --taro:#a99bb5;--taro-deep:#796288;--taro-soft:#f5eff6;--butter:#f0c75f;--butter-light:#f7d97e;--butter-deep:#b6801e;
      --teal:#315f5b;--canvas:#fff9ec;--surface:#fffdf9;--surface-soft:#fff4e2;
      --ink:#3f3748;--muted:#6f6578;--faint:#9b91a5;--line:#ddcfdd;
      --success:#3e735e;--success-bg:#e7f1e9;--warning:#9a6815;--warning-bg:#fff0c7;
      --danger:#a34f58;--danger-bg:#fbe8e8;--shadow:0 2px 5px rgba(93,82,107,.08);
      --topbar-bg:rgba(255,249,236,.94);--surface-alt:#fff8ed;--ink-soft:#544b5c;--chip-bg:#f5eff6;--chip-ink:#685878;
      --viewas-ink:#554461;--hover-bg:#fff2da;--link:#796288;--switch-off:#d8cbd6;--primary:#f0c75f;--primary-ink:#3f3748;color-scheme:light;
      /* 日报编辑器（CodeMirror）。源码在仓库的 editor/，配色全部读这几个变量 */
      --violet-ink:#796288;--ed-active:rgba(169,155,181,.11);--ed-sel:rgba(216,198,220,.55);
      --ed-code-bg:#f7f0f3;--ed-code-ink:#9a6815;--ed-kw:#7d5d8d;--ed-str:#39715d;
      --ed-num:#af6c34;--ed-fn:#416a9d;--ed-type:#9a6815;--ed-op:#387b84;
    }
    /* 黑夜模式：只换颜色变量，版式一点不动 */
    :root[data-theme="dark"]{
      --nav:#302838;--nav-deep:#211a28;--nav-text:#fff8ed;--violet:#d8c6dc;
      --taro:#c7b5cf;--taro-deep:#8e7798;--taro-soft:#3d3246;--butter:#f0c75f;--butter-light:#f7d97e;--butter-deep:#b6801e;
      --teal:#78b7ab;--canvas:#18121e;--surface:#2b2431;--surface-soft:#372d3d;--surface-alt:#322a38;
      --ink:#fff8ed;--ink-soft:#ded3dc;--muted:#c9bdc8;--faint:#9e91a1;--line:#4b3e53;
      --success:#91cfad;--success-bg:#1e3b31;--warning:#f1ca72;--warning-bg:#443315;--danger:#f1a5ad;--danger-bg:#49252c;
      --shadow:0 3px 10px rgba(0,0,0,.28);--topbar-bg:rgba(33,27,38,.92);--chip-bg:#403547;--chip-ink:#e0cde3;
      --viewas-ink:#e6d4e8;--hover-bg:#3b3043;--link:#d5bde0;--switch-off:#5b4c62;--primary:#f0c75f;--primary-ink:#33263a;color-scheme:dark;
      --violet-ink:#dac5df;--ed-active:rgba(216,198,220,.1);--ed-sel:rgba(216,198,220,.29);
      --ed-code-bg:#372d3d;--ed-code-ink:#f1ca72;--ed-kw:#e0bde1;--ed-str:#b8dfaa;
      --ed-num:#f0aa7b;--ed-fn:#a9c8f4;--ed-type:#f1ca72;--ed-op:#a9dce0;
    }
    *{box-sizing:border-box}
    html{background:var(--canvas)}
    body{margin:0;min-height:100vh;color:var(--ink);background:var(--canvas);
      font:460 14px/1.5 "Avenir Next","SF Pro Rounded","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:disabled{cursor:wait;opacity:.55}
    a{color:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);transition:grid-template-columns .2s ease}
    /* 高度按缩放比例换算：整站缩放后 100vh 会被一起放大，侧边栏会比屏幕高 */
    .sidebar{position:sticky;top:0;height:calc(100vh / var(--zoom,1));padding:26px 18px 20px;background:var(--nav);
      color:var(--nav-text);display:flex;flex-direction:column;overflow-x:hidden}
    .brand-row{display:flex;align-items:flex-start;gap:8px;padding:0 0 28px}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px;flex:1;min-width:0;border:0;background:transparent;color:inherit;text-align:left}
    .sidebar-toggle{flex:none;width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.15);
      border-radius:8px;background:transparent;color:#bcbac9;display:grid;place-items:center}
    .sidebar-toggle:hover{background:rgba(255,255,255,.08);color:#fff}
    .sidebar-toggle svg{transition:transform .2s ease}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .brand-button{display:grid;width:44px;height:44px;place-items:center;flex:none;border:1px solid var(--butter-deep);border-bottom-width:4px;border-radius:50%;background:var(--butter);box-shadow:0 4px 0 var(--butter-deep);transition:transform .13s ease,box-shadow .13s ease}
    .brand:hover .brand-button{background:var(--butter-light);box-shadow:0 5px 0 var(--butter-deep)}
    .brand:active .brand-button{transform:translateY(2px);border-bottom-width:2px;box-shadow:0 1px 0 var(--butter-deep)}
    .brand-mark{width:31px;height:31px;display:block;flex:none}
    .brand-words{display:grid;gap:3px;min-width:0}
    .brand-name{color:#fffdf9;font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1;text-shadow:0 1px 0 rgba(45,31,54,.24)}
    .brand-copy{color:#fff0c8;font-size:8px;font-weight:400;letter-spacing:.06em;line-height:1.2;white-space:nowrap}
    .nav-icon{width:17px;height:17px;flex:none;opacity:.8}
    .nav button.active .nav-icon{opacity:1}
    /* 收起后只剩图标：没有图标的话侧边栏就是一列光秃秃的数字，认不出是哪一页 */
    .shell.sidebar-collapsed .nav button .count{display:none}
    .nav-label{padding:0 10px 8px;color:#77738f;font-size:10px;font-weight:700;
      letter-spacing:1.2px;text-transform:uppercase}
    .nav{display:grid;gap:4px}
    .nav button{width:100%;border:0;background:transparent;color:#bcbac9;text-align:left;
      border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;display:flex;align-items:center;gap:9px}
    .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    .nav button.active{background:rgba(216,198,220,.18);color:#fff}
    .nav .count{min-width:22px;padding:1px 6px;text-align:center;border-radius:99px;
      background:rgba(255,255,255,.09);font-size:11px}
    .nav button.active .count{background:var(--butter);color:var(--primary-ink)}
    .sidebar-foot{position:relative;margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,248,237,.18)}
    .connection{display:flex;gap:8px;align-items:center;color:#bcbac9;font-size:12px}
    .pulse{width:7px;height:7px;border-radius:50%;background:#7dd5ac;box-shadow:0 0 0 4px rgba(125,213,172,.1)}
    .account-menu{position:relative}.account-trigger{width:100%;padding:8px;border:0;border-radius:10px;background:transparent;color:#fffdf9;display:grid;grid-template-columns:32px minmax(0,1fr) 14px;gap:9px;align-items:center;text-align:left;transition:background .14s ease}
    .account-trigger:hover,.account-menu.open .account-trigger{background:rgba(255,255,255,.1)}
    .account-avatar{width:32px;height:32px;border-radius:50%;background:var(--butter);color:var(--primary-ink);display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(63,55,72,.14)}
    .account-copy{display:grid;min-width:0;gap:1px}.account-copy strong,.account-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account-copy strong{font-size:12px;line-height:1.25}.account-copy small{color:#d8ced9;font-size:10px;line-height:1.25}
    .account-chevron{width:14px;height:14px;color:#d8ced9;transition:transform .14s ease}.account-menu.open .account-chevron{transform:rotate(180deg)}
    .account-popover{position:absolute;z-index:40;left:0;bottom:calc(100% + 10px);width:100%;min-width:216px;padding:6px;border:1px solid color-mix(in srgb,var(--line) 70%,var(--taro));border-radius:12px;background:var(--surface-alt);box-shadow:0 16px 34px rgba(23,17,27,.3);color:var(--ink);transform-origin:bottom left;animation:menu-in .14s ease both}
    .account-summary{display:grid;grid-template-columns:32px minmax(0,1fr);gap:9px;align-items:center;padding:8px}.account-summary .account-copy strong{font-size:12px}.account-summary .account-copy small{color:var(--muted)}
    .account-menu-rule{height:1px;margin:5px 2px;background:var(--line)}
    .account-menu-item{width:100%;min-height:36px;padding:8px;border:0;border-radius:8px;background:transparent;color:var(--ink);display:flex;align-items:center;gap:9px;text-align:left;font-size:12px}.account-menu-item:hover{background:var(--hover-bg)}.account-menu-item svg{width:16px;height:16px;flex:none;color:var(--muted)}
    .account-menu-item.danger{color:var(--danger)}.account-menu-item.danger svg{color:var(--danger)}.account-menu-item.danger:hover{background:var(--danger-bg)}
    .workspace{min-width:0}
    /* 收起：缩成 78px 的图标条，不是整个藏起来——收起后还看得见在哪一页。
       640px 以下侧边栏是底部导航条，收了就没法切页面，所以那一档不参与 */
    .shell.sidebar-collapsed{grid-template-columns:78px minmax(0,1fr)}
    .shell.sidebar-collapsed .sidebar{padding-left:10px;padding-right:10px}
    .shell.sidebar-collapsed .brand-row{display:grid;justify-items:center;gap:10px}
    .shell.sidebar-collapsed .brand{flex:none;padding:0}
    .shell.sidebar-collapsed .brand-name,.shell.sidebar-collapsed .brand-copy,
    .shell.sidebar-collapsed .nav-label,.shell.sidebar-collapsed .nav button .nav-text,
.shell.sidebar-collapsed .connection span,.shell.sidebar-collapsed .account-trigger .account-copy,.shell.sidebar-collapsed .account-trigger .account-chevron,.shell.sidebar-collapsed .guide-text{display:none}
    .shell.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
    .shell.sidebar-collapsed .nav button{justify-content:center;min-height:44px;padding:10px 8px}
    .shell.sidebar-collapsed .guide-link{justify-content:center;padding:10px 8px}
    .shell.sidebar-collapsed .sidebar{overflow:visible}.shell.sidebar-collapsed .sidebar-foot{padding-left:4px;padding-right:4px}.shell.sidebar-collapsed .account-trigger{display:grid;grid-template-columns:32px;justify-content:center;padding:8px}.shell.sidebar-collapsed .account-popover{left:calc(100% + 10px);bottom:0;width:236px}
    .topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
    .icon-btn{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;flex:none;
      background:var(--surface-soft);color:var(--muted);display:grid;place-items:center}
    .icon-btn:hover{color:var(--ink)}
    /* 缩放没有按钮了（Ctrl/⌘ + 滚轮），所以缩的时候闪一下当前倍数，不然没反馈 */
    .zoom-badge{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:60;
      padding:6px 14px;border-radius:99px;background:var(--ink);color:var(--surface);
      font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none;
      opacity:0;transition:opacity .15s}
    .zoom-badge.show{opacity:.92}
    .topbar{min-height:86px;padding:19px 34px;border-bottom:1px solid var(--line);
      background:var(--topbar-bg);backdrop-filter:blur(12px);display:flex;
      align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:10}
    .page-title h1{font-size:24px;line-height:1.08;letter-spacing:-.6px;margin:0;font-weight:600}
    .page-title p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .toolbar{display:grid;grid-template-columns:136px 108px 142px 96px 62px;gap:8px;align-items:end;max-width:100%}
    .toolbar .field{display:grid;gap:5px;min-width:0}
    .toolbar .field label{min-height:14px;line-height:14px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
    input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;
      min-height:38px;padding:7px 10px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--taro);box-shadow:0 0 0 3px color-mix(in srgb,var(--taro) 24%,transparent)}
    .toolbar input,.filter-select-trigger{width:100%;min-width:0;height:38px;min-height:38px;padding:7px 30px 7px 11px;
      border-color:color-mix(in srgb,var(--line) 86%,var(--taro));background-color:var(--surface);
      box-shadow:inset 0 1px 0 color-mix(in srgb,var(--surface) 80%,white 20%);transition:border-color .14s ease,box-shadow .14s ease,background-color .14s ease}
    .toolbar input:hover,.filter-select-trigger:hover{border-color:color-mix(in srgb,var(--taro) 58%,var(--line));background-color:var(--surface-alt)}
    .toolbar input:focus{border-color:var(--butter-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--butter) 25%,transparent),inset 0 1px 0 color-mix(in srgb,var(--surface) 80%,white 20%)}
    .filter-select-trigger:focus,.filter-select.open .filter-select-trigger{border-color:var(--taro);box-shadow:0 0 0 3px color-mix(in srgb,var(--taro) 24%,transparent),inset 0 1px 0 color-mix(in srgb,var(--surface) 80%,white 20%)}
    .filter-select{position:relative}.filter-select.open{z-index:3}.filter-select-native{display:none}
    .filter-select-trigger{position:relative;border-radius:7px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .filter-select-trigger::after{content:"";position:absolute;right:12px;top:14px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .14s ease}
    .filter-select.open .filter-select-trigger::after{transform:translateY(3px) rotate(225deg);border-color:var(--muted)}
    .filter-menu{position:absolute;z-index:30;top:calc(100% + 7px);left:0;width:max(100%,172px);max-width:calc(100vw - 32px);padding:5px;border:1px solid color-mix(in srgb,var(--line) 72%,var(--taro));border-radius:10px;background:var(--surface-alt);box-shadow:0 14px 30px rgba(0,0,0,.34);display:grid;gap:2px;transform-origin:top left;animation:menu-in .14s ease both}
    @keyframes menu-in{from{opacity:0;transform:translateY(-3px) scale(.98)}to{opacity:1;transform:none}}
    .filter-option{width:100%;min-height:34px;padding:7px 9px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink);display:grid;grid-template-columns:14px minmax(0,1fr);gap:7px;align-items:center;text-align:left;font-size:12px;line-height:1.25}
    .filter-option:hover{background:var(--hover-bg)}.filter-option[aria-selected="true"]{background:color-mix(in srgb,var(--butter) 17%,var(--surface-alt));color:var(--ink)}
    .filter-option.active{border-color:color-mix(in srgb,var(--taro) 72%,var(--line));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--taro) 18%,transparent)}
    .filter-option-mark{color:var(--butter);font-size:12px;font-weight:800;opacity:0}.filter-option[aria-selected="true"] .filter-option-mark{opacity:1}
    .toolbar input[type="date"]{accent-color:var(--butter);font-variant-numeric:tabular-nums}
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.72}.toolbar input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
    #reload-day{align-self:end;height:38px;min-height:38px;padding:7px 10px;border-color:color-mix(in srgb,var(--line) 78%,var(--taro));background:var(--surface-soft);color:var(--muted);white-space:nowrap;box-shadow:none}
    #reload-day:hover{border-color:var(--taro);background:var(--hover-bg);color:var(--ink)}
    .topbar .toolbar input,.topbar .filter-select-trigger,.topbar #reload-day,.topbar .lang-switch,.topbar .theme-toggle{border-color:var(--taro-deep);background:var(--taro);color:var(--primary-ink);box-shadow:0 2px 0 var(--taro-deep)}
    .topbar .toolbar input:hover,.topbar .filter-select-trigger:hover,.topbar #reload-day:hover,.topbar .lang-switch:hover,.topbar .theme-toggle:hover{border-color:var(--taro-deep);background:color-mix(in srgb,var(--taro) 82%,white 18%);color:var(--primary-ink)}
    .topbar .toolbar input:focus,.topbar .filter-select-trigger:focus,.topbar .filter-select.open .filter-select-trigger{border-color:var(--taro-deep);box-shadow:0 2px 0 var(--taro-deep),0 0 0 3px color-mix(in srgb,var(--taro) 28%,transparent)}
    .topbar .toolbar input:active,.topbar .filter-select-trigger:active,.topbar #reload-day:active,.topbar .lang-switch:active,.topbar .theme-toggle:active{transform:translateY(2px);box-shadow:0 0 0 var(--taro-deep)}
    main{max-width:1240px;margin:0 auto;padding:30px 34px 72px}
    .view{display:none}.view.active{display:block;animation:enter .24s ease both}
    @keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .loading{display:none;padding:80px 20px;text-align:center;color:var(--muted)}
    .loading.show{display:block}
    .spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--primary);
      border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-state{display:none;background:var(--danger-bg);color:var(--danger);padding:14px 16px;
      border-radius:8px;margin-bottom:18px}.error-state.show{display:flex;justify-content:space-between;gap:16px}
    .hero{background:var(--nav);color:#fffdf9;border-radius:16px;padding:27px 30px;position:relative;
      overflow:hidden;box-shadow:0 12px 32px rgba(93,82,107,.18)}
    .hero:after{content:"";position:absolute;width:360px;height:280px;right:-80px;top:-130px;
      background:radial-gradient(circle,rgba(240,199,95,.32),rgba(216,198,220,0) 68%)}
    .eyebrow{font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#fff0c8}
    .hero h2{font-size:30px;line-height:1.1;letter-spacing:-.8px;margin:7px 0 8px;font-weight:600;max-width:700px}
    .hero p{margin:0;color:#f2e7f1;max-width:640px}
    .hero .hero-action{position:absolute;right:28px;bottom:27px;z-index:1}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 24px}
    .metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow)}
    .metric strong{display:block;font-size:27px;line-height:1;font-weight:600;letter-spacing:-.7px}
    .metric span{display:block;color:var(--muted);font-size:11px;margin-top:7px}
    .metric.attention strong{color:var(--warning)}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:28px 0 12px}
    .section-head h2{font-size:17px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.25px}
    .section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
    .panel-pad{padding:20px}
    .item{padding:16px 18px;border-top:1px solid var(--line)}.item:first-child{border-top:0}
    .item-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
    .item-title{font-size:14px;font-weight:600}.item-body{margin-top:5px;color:var(--ink-soft)}
    .meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .tag{display:inline-flex;align-items:center;min-height:22px;border-radius:99px;padding:2px 8px;
      background:var(--surface-soft);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.2px}
    .tag.done,.tag.human{background:var(--success-bg);color:var(--success)}
    .tag.blocked,.tag.low{background:var(--danger-bg);color:var(--danger)}
    .tag.wip,.tag.medium{background:var(--warning-bg);color:var(--warning)}
    .tag.unknown{background:var(--chip-bg);color:var(--chip-ink)}
    .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:38px;
      padding:8px 13px;font-weight:600;font-size:12px}
    .btn:hover{border-color:var(--taro);background:var(--hover-bg)}.btn:active{transform:translateY(1px)}
    .btn.primary{border-color:var(--butter-deep);background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 0 var(--butter-deep)}
    .btn.primary:hover{background:var(--butter-light)}
    .btn.primary:active{box-shadow:0 1px 0 var(--butter-deep)}
    .btn.danger{color:var(--danger)}
    .btn.small{min-height:32px;padding:6px 10px}
    .empty{padding:44px 20px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
    details.timeline{border-top:1px solid var(--line)}details.timeline:first-child{border-top:0}
    details.timeline summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;gap:14px}
    details.timeline summary::-webkit-details-marker{display:none}
    details.timeline[open] summary{background:var(--surface-alt)}
    .timeline-body{padding:0 18px 17px 34px}.progress-line{position:relative;padding:8px 0 8px 18px;border-left:1px solid var(--line)}
    .progress-line:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--taro);left:-4px;top:15px}

    .report-paper{padding:26px 34px 30px;font-size:14.5px;line-height:1.75;color:var(--ink)}

    /* 日报按 Obsidian 的写法显示：折叠、待办、提示框、表格、代码块、图片 */

      border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}

    .switch input{opacity:0;width:0;height:0;min-height:0;position:absolute}
    .switch span{position:absolute;inset:0;border-radius:99px;background:var(--switch-off);transition:.15s;cursor:pointer}
    .switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;
      background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
    .switch input:checked+span{background:var(--nav)}
    .switch input:checked+span:before{transform:translateX(18px)}
    .switch input:focus-visible+span{box-shadow:0 0 0 3px rgba(119,113,166,.3)}
    .folder{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;
      padding:11px 18px;border-top:1px solid var(--line);cursor:pointer}
    .folder:first-child{border-top:0}
    .folder:hover{background:var(--surface-alt)}
    .folder input{width:16px;height:16px;min-height:0;accent-color:var(--nav)}
    .folder-path{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
    .folder-drop{border:0;background:transparent;color:var(--faint);width:24px;height:24px;
      border-radius:6px;font-size:15px;line-height:1;padding:0;opacity:0;flex:none}
    .folder:hover .folder-drop,.folder-drop:focus-visible{opacity:1}
    .folder-drop:hover{background:var(--danger-bg);color:var(--danger)}
    .folder-group{background:var(--surface-alt);grid-template-columns:16px minmax(0,1fr) auto auto auto;gap:10px}
    .folder-bulk{display:flex;gap:4px;flex:none}
    .btn.tiny{min-height:24px;padding:0 8px;font-size:11px;border-radius:6px}
    .folder-tally{font-variant-numeric:tabular-nums}
    .folder-toggle{border:0;background:transparent;color:var(--muted);width:16px;height:16px;
      padding:0;font-size:10px;line-height:1;transition:transform .12s}
    .folder-toggle.open{transform:rotate(90deg)}
    .folder-kids .folder{padding-left:34px;background:var(--surface)}
    .folder-kids .folder-path{color:var(--ink-soft)}
    /* 组名那个路径本身也是一条，标出来，不然和组头长得一模一样 */
    .folder-self{font-family:inherit;color:var(--muted);font-size:12px}
    .folder.gone{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 30px;opacity:.6}
    .folder.gone .folder-path{text-decoration:line-through;text-decoration-color:var(--faint)}
    .folders-gone{padding:11px 18px;border-top:1px solid var(--line);font-size:12px;
      color:var(--muted);background:var(--surface-alt)}
    .folders-gone button{border:0;background:transparent;color:var(--link);padding:0 2px;font-size:12px}
    .panel-foot{display:flex;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);
      background:var(--surface-alt);flex-wrap:wrap}
    .panel-foot input{flex:1;min-width:220px}
    @media(max-width:900px){
      .shell:not(.sidebar-expanded){grid-template-columns:78px minmax(0,1fr)}
      .shell:not(.sidebar-expanded) .sidebar{padding:22px 10px}
      .shell:not(.sidebar-expanded) .brand{padding:0 8px}
      .shell:not(.sidebar-expanded) .brand-copy,.shell:not(.sidebar-expanded) .brand-name,
      .shell:not(.sidebar-expanded) .nav-label,.shell:not(.sidebar-expanded) .nav button .nav-text,
.shell:not(.sidebar-expanded) .connection span,.shell:not(.sidebar-expanded) .account-trigger .account-copy,.shell:not(.sidebar-expanded) .account-trigger .account-chevron,.shell:not(.sidebar-expanded) .guide-text{display:none}
      .shell:not(.sidebar-expanded) .nav button{justify-content:center;min-height:44px}
      .shell:not(.sidebar-expanded) .nav button .count{display:none}
      .shell:not(.sidebar-expanded) .sidebar{overflow:visible}.shell:not(.sidebar-expanded) .sidebar-foot{padding-left:4px;padding-right:4px}.shell:not(.sidebar-expanded) .account-trigger{grid-template-columns:32px;justify-content:center;padding:8px}.shell:not(.sidebar-expanded) .account-popover{left:calc(100% + 10px);bottom:0;width:236px}
      .shell.sidebar-expanded{grid-template-columns:232px minmax(0,1fr)}
      .shell.sidebar-expanded .sidebar{padding:26px 18px 20px}.topbar{padding:17px 22px;align-items:flex-start}.toolbar{grid-template-columns:132px 102px 132px 92px 62px;gap:7px}
      main{padding:24px 22px 64px}.two-col,.report-layout{grid-template-columns:1fr}.report-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.report-nav button{width:auto;white-space:nowrap}
      .review-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}
    }
    /* 桌面窄窗口还没到手机导航时，先把筛选区折成两行，避免固定五列挤出页面。 */
    @media(max-width:1100px) and (min-width:641px){
      .topbar{padding:17px 22px;align-items:flex-start}
      .topbar-actions{flex:1 1 520px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end}
      .toolbar,.shell.sidebar-expanded .toolbar{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
      .toolbar .field:first-child{grid-column:1/-1}
      .toolbar #reload-day{width:100%}
    }
    @media(max-width:640px){
      .shell{display:block}.sidebar{position:fixed;z-index:20;top:auto;bottom:0;width:100%;height:62px;padding:7px 8px;background:var(--nav-deep)}
      .brand-row,.nav-label,.sidebar-foot,.sidebar-toggle{display:none}.nav{grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}.nav button{padding:6px 3px;display:grid;place-items:center;gap:2px;font-size:10px}.nav button .nav-text{display:block}.nav .count{font-size:9px;min-width:18px;padding:0 4px}
      .topbar{position:static;display:block;padding:18px 16px}.topbar-actions{margin-top:15px;display:grid;grid-template-columns:1fr auto auto;align-items:end}.toolbar{grid-column:1/-1;margin:0;grid-template-columns:1fr 1fr;gap:10px}.toolbar .field:first-child{grid-column:1/-1}.toolbar input,.filter-select-trigger{width:100%;max-width:none}.toolbar #reload-day{width:100%;padding-left:12px;padding-right:12px}
      main{padding:20px 14px 92px}.hero{padding:23px 21px}.hero h2{font-size:25px}.hero .hero-action{position:static;margin-top:18px}.metrics{gap:8px}.metric{padding:14px}.metric strong{font-size:23px}
      .two-col{display:block}.two-col>div+div{margin-top:18px}.task-row{grid-template-columns:1fr}.task-actions{justify-content:flex-start}.report-paper{padding:22px 18px}.toast{left:14px;right:14px;bottom:76px}
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" data-i18n-aria="nav_aria">
    <div class="brand-row">
      <button class="brand" type="button" aria-label="Fecho brand" data-i18n-aria="brand_aria">
        <span class="brand-button" aria-hidden="true"><svg class="brand-mark" viewBox="0 0 200 200"><rect x="76" y="36" width="48" height="128" rx="14" fill="#fffdf9"/><rect x="36" y="76" width="128" height="48" rx="14" fill="#fffdf9"/></svg></span>
        <span class="brand-words"><span class="brand-name">Fecho</span><span class="brand-copy">FEED WORK. ECHO PROGRESS.</span></span>
      </button>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true" data-i18n-aria="sidebar_collapse"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only" data-i18n="sidebar_collapse"></span></button>
    </div>
    <div class="nav-label">Workspace</div>
    <nav class="nav">
      <button class="active" data-view="today"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3M16 2v3M3.5 9h17M4 5.5h16a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_today"></span><span class="count" id="nav-today">—</span></button>
      <button data-view="review"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 12.5 2 2 4-4M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_review"></span><span class="count" id="nav-review">—</span></button>
      <button data-view="tasks"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_tasks"></span><span class="count" id="nav-tasks">—</span></button>
      <button data-view="reports"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7l-4-4Zm0 0v4h4M9 12h6M9 16h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_reports"></span><span class="count" id="nav-reports">—</span></button>
      <button data-view="system"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_system"></span><span class="count" id="nav-system">—</span></button>
      <button data-view="feedback" data-cloud-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5A8.3 8.3 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_feedback"></span><span class="count" id="nav-feedback">—</span></button>
      <button data-view="admin" data-admin-only hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.3 2.9 8.3 7 9.5 4.1-1.2 7-5.2 7-9.5V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-text" data-i18n="nav_admin"></span><span class="count" id="nav-admin">—</span></button>
    </nav>
    <a class="guide-link" href="/guide" target="_blank" rel="noopener"><span class="guide-icon" aria-hidden="true">↗</span><span class="guide-text" data-i18n="nav_guide"></span></a>
    <div class="sidebar-foot">
      <div class="connection" data-local-only><i class="pulse"></i><span id="connection-copy" data-i18n="connection_local"></span></div>
      <div class="account-menu" id="account-menu" data-cloud-only hidden>
        <button class="account-trigger" id="account-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-popover" data-i18n-aria="account_aria"><span class="account-avatar" id="account-avatar" aria-hidden="true"></span><span class="account-copy"><strong id="account-name"></strong><small id="account-email"></small></span><svg class="account-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="account-popover" id="account-popover" role="menu" data-i18n-aria="account_menu_aria" hidden>
          <div class="account-summary"><span class="account-avatar" data-account-avatar aria-hidden="true"></span><span class="account-copy"><strong data-account-name></strong><small data-account-email></small></span></div>
          <div class="account-menu-rule" role="separator"></div>
          <button class="account-menu-item" type="button" role="menuitem" data-account-action="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8.5-3a8.5 8.5 0 0 0-.13-1.4l2-1.5-2-3.5-2.4.9a8.5 8.5 0 0 0-2.4-1.4L15.2 2h-4l-.37 2.6a8.5 8.5 0 0 0-2.4 1.4l-2.4-.9-2 3.5 2 1.5a8.5 8.5 0 0 0 0 2.8l-2 1.5 2 3.5 2.4-.9a8.5 8.5 0 0 0 2.4 1.4l.37 2.6h4l.37-2.6a8.5 8.5 0 0 0 2.4-1.4l2.4.9 2-3.5-2-1.5c.08-.46.13-.93.13-1.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="account_settings"></span></button>
          <div class="account-menu-rule" role="separator"></div>
          <button class="account-menu-item danger" id="account-logout" type="button" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="account_logout"></span></button>
        </div>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <div class="page-title"><h1 id="page-title"></h1><p id="page-subtitle"></p></div>
      </div>
      <div class="topbar-actions">
        <div class="toolbar" data-i18n-aria="filters_aria">
          <div class="field"><label for="work-date" data-i18n="filter_date"></label><input id="work-date" type="date"></div>
          <div class="field filter-select" data-filter-select="agent-filter"><label id="agent-filter-label" for="agent-filter-trigger" data-i18n="filter_agent"></label><select id="agent-filter" class="filter-select-native" aria-hidden="true" tabindex="-1"><option value=""></option></select><button class="filter-select-trigger" id="agent-filter-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="agent-filter-menu" aria-labelledby="agent-filter-label" data-filter-trigger="agent-filter" disabled></button><div class="filter-menu" id="agent-filter-menu" role="listbox" aria-labelledby="agent-filter-label" hidden></div></div>
          <div class="field filter-select" data-filter-select="source-filter"><label id="source-filter-label" for="source-filter-trigger" data-i18n="filter_source"></label><select id="source-filter" class="filter-select-native" aria-hidden="true" tabindex="-1"><option value=""></option></select><button class="filter-select-trigger" id="source-filter-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="source-filter-menu" aria-labelledby="source-filter-label" data-filter-trigger="source-filter" disabled></button><div class="filter-menu" id="source-filter-menu" role="listbox" aria-labelledby="source-filter-label" hidden></div></div>
          <div class="field filter-select" data-filter-select="status-filter"><label id="status-filter-label" for="status-filter-trigger" data-i18n="filter_status"></label><select id="status-filter" class="filter-select-native" aria-hidden="true" tabindex="-1"><option value=""></option></select><button class="filter-select-trigger" id="status-filter-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="status-filter-menu" aria-labelledby="status-filter-label" data-filter-trigger="status-filter" disabled></button><div class="filter-menu" id="status-filter-menu" role="listbox" aria-labelledby="status-filter-label" hidden></div></div>
          <button class="btn" id="reload-day" type="button" data-i18n="reload"></button>
        </div>
        <button class="lang-switch" id="lang-toggle" type="button" data-i18n-aria="lang_aria"></button>
        <button class="theme-toggle" id="theme-toggle" type="button" data-i18n-aria="theme_aria"><svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z" fill="currentColor"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <main>
      <div id="error-state" class="error-state"><span id="error-copy"></span><button class="btn small" id="retry" data-i18n="retry"></button></div>
      <div id="viewas" class="viewas" role="status"><span id="viewas-copy"></span><button class="btn small" id="viewas-exit" data-i18n="viewas_exit"></button></div>
      <div id="loading" class="loading show"><div class="spinner"></div><span id="loading-copy" data-i18n="loading"></span></div>

      <section class="view active" data-page="today" aria-labelledby="today-heading">
        <div class="hero"><div class="eyebrow" id="today-date">WORK LOG</div><h2 id="today-heading" data-i18n="hero_default"></h2><p id="today-summary" data-i18n="hero_loading"></p><button class="btn primary hero-action" data-go="review" data-i18n="hero_review"></button></div>
        <div class="metrics" id="metrics"></div>
        <div class="two-col">
          <div><div class="section-head"><div><h2 data-i18n="today_tasks"></h2><p data-i18n="today_tasks_sub"></p></div></div><div class="panel" id="today-tasks"></div></div>
          <div><div class="section-head"><div><h2 data-i18n="attention"></h2><p data-i18n="attention_sub"></p></div></div><div class="panel" id="attention"></div></div>
        </div>
        <div class="section-head"><div><h2 data-i18n="timeline"></h2><p data-i18n="timeline_sub"></p></div></div><div class="panel" id="timeline"></div>
      </section>

      <section class="view" data-page="review" aria-labelledby="review-heading">
        <div class="section-head"><div><h2 id="review-heading" data-i18n="review_heading"></h2><p data-i18n="review_sub"></p></div><span class="tag" id="review-total">0</span></div>
        <div class="panel" id="review-list"></div>
        <div class="section-head"><div><h2 data-i18n="hidden_heading"></h2><p data-i18n="hidden_sub"></p></div></div>
        <div class="panel" id="hidden-list"></div>
      </section>

      <section class="view" data-page="tasks" aria-labelledby="tasks-heading">
        <div class="section-head"><div><h2 id="tasks-heading" data-i18n="tasks_heading"></h2><p data-i18n="tasks_sub"></p></div>
          <div class="segmented" id="task-tabs"><button class="active" data-task-status="all" data-i18n="tab_all"></button><button data-task-status="open" data-i18n="tab_open"></button><button data-task-status="done" data-i18n="tab_done"></button><button data-task-status="merged" data-i18n="tab_merged"></button></div></div>
        <div class="panel" id="task-list"></div>
      </section>

      <section class="view" data-page="reports" aria-labelledby="reports-heading">
        <div class="section-head"><div><h2 id="reports-heading" data-i18n="reports_heading"></h2></div><div class="button-row"><div class="snap-group" id="snap-group" hidden><button class="btn" id="snap-report" type="button"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="snap"></span></button><button class="btn snap-more" id="snap-settings" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n-aria="snap_settings"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="snap-popover" id="snap-popover" role="dialog" hidden></div></div><button class="btn" id="edit-report" hidden data-i18n="edit"></button><button class="btn primary" id="regenerate" data-i18n="regenerate"></button></div></div>
        <div class="gen-progress" id="gen-progress" role="status" aria-live="polite" hidden></div>
        <div id="report-dirty" class="dirty"><span id="report-dirty-copy"></span><button class="btn small" id="dirty-regenerate" data-i18n="regenerate_now"></button></div>
        <div class="panel report-layout"><div class="report-nav" id="report-tabs"><button class="active" data-report-tab="daily" data-i18n="tab_daily"></button><button data-report-tab="voice" data-i18n="tab_voice"></button><button data-report-tab="history" data-i18n="tab_history"></button><button data-report-tab="warnings" data-i18n="tab_warnings"></button><div class="quick-api-entry"><div class="quick-api-row"><button id="quick-api-open" type="button"><span data-i18n="quick_api"></span></button><button id="quick-api-help" type="button" data-i18n-aria="quick_api_help_label">?</button></div><div id="quick-api-help-text" class="quick-api-help-text" hidden></div></div></div><div class="report-paper" id="report-content" data-i18n="not_generated"></div></div>
      </section>

      <section class="view" data-page="system" aria-labelledby="system-heading">
        <div class="section-head"><div><h2 id="system-heading" data-i18n="system_heading"></h2><p data-i18n="system_sub"></p></div></div>
        <div class="two-col"><div><div class="panel panel-pad" id="doctor"></div></div><div><div class="panel panel-pad" id="automation-status"></div><div class="panel panel-pad" id="sources" style="margin-top:18px"></div></div></div>
        <div class="section-head"><div><h2 data-i18n="recent_scans"></h2><p data-i18n="recent_scans_sub"></p></div></div><div class="panel" style="overflow:auto"><table><thead><tr><th data-i18n="th_time"></th><th data-i18n="th_agent"></th><th data-i18n="th_project"></th><th data-i18n="th_status"></th><th data-i18n="th_result"></th></tr></thead><tbody id="scan-runs"></tbody></table></div>
      </section>

      <section class="view" data-page="settings" aria-labelledby="settings-heading">
        <div class="section-head"><div><h2 id="settings-heading" data-i18n="settings_time"></h2><p data-i18n="settings_time_sub"></p></div></div>
