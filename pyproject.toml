[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fecho"
version = "0.6.1"
description = "Agent 优先的工作日志系统：agent 边干边记，自动归到 Mobius 任务上，日终出日报和口播稿"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.26",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]
# 云端版：数据放 Supabase（Postgres）
cloud = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2",
         "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "cryptography>=41"]

[project.scripts]
fecho = "fecho.cli:main"
fecho-mcp = "fecho.mcp_server:main"

[tool.setuptools]
packages = ["fecho"]

[tool.setuptools.package-data]
fecho = ["presets/personas/*.json", "presets/dashboard.html", "presets/skill/*.md"]
