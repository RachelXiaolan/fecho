[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-worklog"
version = "0.2.0"
description = "Agent 优先的工作日志系统：agent 边干边记，自动归到 Mobius 任务上，日终出日报和口播稿"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.26",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]

[project.scripts]
scribe = "scribe.cli:main"
scribe-mcp = "scribe.mcp_server:main"

[tool.setuptools]
packages = ["scribe"]

[tool.setuptools.package-data]
scribe = ["presets/personas/*.json"]
